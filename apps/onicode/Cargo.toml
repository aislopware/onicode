[package]
name = "onicode"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Shared by both binaries; the UI is referenced only by `onicode`, so the
# background engine links without it.
[lib]
name = "onicode_app"
path = "src/lib.rs"

[[bin]]
name = "onicode"
path = "src/main.rs"

[[bin]]
name = "onicode-engine"
path = "src/bin/onicode-engine.rs"
doc = false

[dependencies]
onicode-engine.workspace = true
onicode-rpc.workspace = true
onicode-ui.workspace = true
onicode-update.workspace = true
onicode-cli.workspace = true
onicode-mcp.workspace = true
onicode-notify.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The custom allocator is macOS-only (see main.rs): glibc measured flat on the
# same streaming/scroll workloads, so Linux keeps the system allocator.
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
tempfile.workspace = true
