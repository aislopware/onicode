[package]
name = "oni-kde-snap-shot"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-channel = "2"
futures-core = { version = "0.3", default-features = false }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "6.3", default-features = false, features = ["default-rt", "proxy", "service"] }
zruntime = { version = "0.2", default-features = false, features = ["helper"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
