# cargo-nextest settings for CI and the dev check (pass with --config-file).
#
# No retries in any profile: a flaky test gets a deterministic repro, never a rerun. A test that leaves a
# child process or an open handle behind fails, and a hung test is killed after ten minutes.
#
# Flaky before retries went, each awaiting a deterministic repro:
#   onicode-ui state::tests::bootstrap_reports_local_assembly_failure_before_returning_a_handle
#     (bind(:0) + drop port probe races listener teardown, about one run in three);
#   onicode-harness opencode::mcp_injection_tests::mcp_injection_reaches_isolated_server_processes
#     (the 2 s `--version` probe times out on a loaded runner).
[profile.default]
retries = 0
fail-fast = false
leak-timeout = { period = "500ms", result = "fail" }
slow-timeout = { period = "60s", terminate-after = 10 }

# preview `discovery` tests bind the fixed port 7331 and serialize with a mutex,
# which does nothing when every test is its own process (nextest): one at a time.
[test-groups.preview-discovery]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary_id(onicode-preview::discovery)'
test-group = 'preview-discovery'

# `ci`: pull requests and main (NEXTEST_PROFILE=ci). Leaves out slow and soak
# tests, which the scheduled runs (default profile) still run:
#   engine doc_host sync at 48-chat scale and against the real 30 s quantum /
#     10 s idle grace (the ~16 small sync_lifecycle tests cover the policy);
#   harness codex: an app server that keeps dying (sleeps the real 1+3+8 s backoff);
#   preview `leak` (RSS growth under churn) and the two discovery tests that
#     assert nothing happens during a 5-7 s sleep.
# The cursor_shim stress test runs 14 rounds instead of 100 (ONICODE_STRESS_ROUNDS).
[profile.ci]
default-filter = '''
not (
  (package(onicode-engine) & (
    test(=doc_host::sync_lifecycle_tests::cold_jobs_get_a_real_timed_turn_without_any_writer_ending)
    | test(=doc_host::sync_lifecycle_tests::slow_checkpoints_survive_idle_grace_with_all_slots_occupied)
    | test(/^doc_host::sync_lifecycle_tests::forty_eight_/)))
  | (binary_id(onicode-harness::codex) & test(=an_app_server_that_keeps_dying_reports_what_it_printed))
  | binary_id(onicode-preview::leak)
  | (binary_id(onicode-preview::discovery) & (test(=a_discovered_server_is_probed_once_not_every_cycle)
      | test(=authentication_callbacks_receive_no_discovery_connections)))
)
'''
