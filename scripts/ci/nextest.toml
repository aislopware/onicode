# nextest profiles for scripts/dev/check.sh and CI. No retries anywhere: a flaky test gets a deterministic repro.

[profile.default]
retries = 0
fail-fast = false
# A test that leaves a child process or handle behind fails.
leak-timeout = { period = "500ms", result = "fail" }
# A hung test is killed after ten minutes.
slow-timeout = { period = "60s", terminate-after = 10 }

# Pull requests and main: the same set today; slow and soak tests get filtered out here when they exist.
[profile.ci]
