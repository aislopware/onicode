# SwiftLint for the iOS app and the Swift scripts. swift-format (.swift-format) owns layout; SwiftLint owns
# everything else. Run from the repo root as
#   swiftlint lint --strict --baseline apps/ios/.swiftlint-baseline.json
# --strict fails on any warning. The baseline holds only the size metrics (function, type and file length,
# complexity, tuple size, parameter count) of code written before these rules: a listed declaration that
# changes size shows up again and must be split or re-listed. Nothing else goes in it.
#
# swift-format choices that are not obvious from .swift-format (JSON takes no comments):
# - 4-space indent, 120 columns, `#if` bodies and `case` labels not indented: the code's existing style.
# - UseLetInEveryBoundCaseVariable off: the code writes `case let .x(a, b)`, which is as clear.
# - BeginDocumentationCommentWithOneLineSummary off: doc comments open with a plain paragraph, not a
#   one-sentence summary line.
# - NeverForceUnwrap and NeverUseForceTry off: force_unwrapping, force_cast and force_try below cover the same
#   ground, so an exception needs one suppression comment, not two.
# - NeverUseImplicitlyUnwrappedOptionals off (and implicitly_unwrapped_optional): UIKit controllers build
#   their views in viewDidLoad, after init, and `UICollectionView!` is the idiomatic declaration for that.
#
# Opt-in rules left out on purpose:
# - redundant_self: its autocorrect resolves names by syntax and rebound a `self.lease` read to a shadowing
#   local; explicit self in escaping closures stays allowed.
# - legacy_objc_type: CAGradientLayer.locations takes NSNumber, NSCache needs object keys, and NSRange
#   arithmetic needs NSString.
# - discouraged_optional_boolean, discouraged_optional_collection: `Bool?` here means "not shown yet".
# - balanced_xctest_lifecycle: setUp only sets XCTest flags; an empty tearDown is noise.
# - function_default_parameter_at_end, switch_case_on_newline, anonymous_argument_in_multiline_closure,
#   let_var_whitespace, attributes, strict_fileprivate: style choices the code does not make.
# - multiline_* and vertical_parameter_alignment_on_call: swift-format's wrapping decides these.

included:
  - apps/ios
  - scripts
excluded:
  # Generated by uniffi-bindgen.
  - apps/ios/Onicode/Core/Generated
  - apps/ios/CoreFFI

# Rules that swift-format's layout contradicts.
disabled_rules:
  # swift-format moves a closure's capture list and parameters to the next line when the call wraps.
  - closure_parameter_position
  # swift-format indents wrapped parameters by one level instead of aligning them under the first.
  - vertical_parameter_alignment
  # swift-format owns trailing commas: always after the last element of a multi-line, multi-element
  # collection, never in a one-element literal whose brackets hug its element.
  - trailing_comma
  # swift-format owns brace placement, including the brace after a wrapped call, condition or signature.
  - opening_brace

opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - array_init
  - async_without_await
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - direct_return
  - discarded_notification_center_observer
  - discouraged_assert
  - discouraged_none_name
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - final_test_case
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - ibinspectable_in_extension
  - identical_operands
  - incompatible_concurrency_annotation
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_uigraphics_function
  - local_doc_comment
  - lower_acl_than_parent
  - modifier_order
  - number_separator
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - override_in_extension
  - period_spacing
  - prefer_key_path
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - private_subject
  - private_swiftui_state
  - prohibited_super_call
  - raw_value_for_camel_cased_codable_enum
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - self_binding
  - shorthand_optional_binding
  - sorted_first_last
  - static_operator
  - strong_iboutlet
  - superfluous_else
  - test_case_accessibility
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_escaping
  - unneeded_parentheses_in_closure_argument
  - unneeded_throws_rethrows
  - unowned_variable_capture
  - untyped_error_in_catch
  - unused_parameter
  - weak_delegate
  - xct_specific_matcher
  - yoda_condition

# swift-format's limit. It cannot break a string literal or a URL, so a line that is one string literal alone (UI
# copy, SVG path data, test corpus) may run long rather than be split into concatenations.
line_length:
  warning: 120
  ignores_urls: true
  excluded_lines_patterns:
    - '^\s*".*"[,)\]]*$'

# Short names for short scopes (`c`, `vc`, `ix`), as in the Rust code. Case, length cap and underscores are
# still checked.
identifier_name:
  min_length: 1
  max_length: 50
