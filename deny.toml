[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Every git dependency is a pinned rev. The forks onicode owns live under aislopware; the rest are named
# one by one until they move there (docs/onicode/upstream.md).
allow-git = [
    "https://github.com/zeronsh/zui",
    "https://github.com/zeronsh/gpui-component",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/xim-rs.git",
    "https://github.com/proptest-rs/proptest",
]

[sources.allow-org]
github = ["aislopware"]
