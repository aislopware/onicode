# cargo-deny (scripts/dev/check.sh deny, the static CI job). Needs a settled Cargo.lock; builds nothing.

[graph]
# The platforms onicode builds for: the macOS and iOS apps, and Linux for the cursory clippy lane.
targets = [
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Each ignored advisory names its id and why it cannot reach onicode.
ignore = [
    # Unmaintained, no maintained release to move to; each comes in through a third-party crate.
    { id = "RUSTSEC-2025-0141", reason = "bincode via heed-types (fff-search's LMDB index); fff-search pins heed 0.22" },
    { id = "RUSTSEC-2024-0436", reason = "paste via metal (gpui, core-video): a proc macro with no runtime code" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via fontdb (cosmic-text) and usvg (gpui); successor skrifa not yet adopted upstream" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz in onicode-text and via usvg; the port to its successor harfrust is tracked in the rendering lane" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via atspi (accesskit_unix): Linux accessibility only, Linux gets cursory support" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via atspi (accesskit_unix): Linux accessibility only" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via atspi (accesskit_unix): Linux accessibility only" },
    # Unsound APIs onicode never calls.
]

[licenses]
# Matched to the crates in Cargo.lock and THIRD_PARTY_NOTICES.md. A new license is a decision: add it here
# and to the notices in the same change.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "deny"
include-dev = true

[licenses.private]
# The workspace's own crates (publish = false) are MIT by LICENSE.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # rustls everywhere; no system OpenSSL.
    { crate = "native-tls", reason = "rustls everywhere; no system OpenSSL" },
    { crate = "openssl", reason = "rustls everywhere; no system OpenSSL" },
    { crate = "openssl-sys", reason = "rustls everywhere; no system OpenSSL" },
]
# Duplicates in the graph today. The list only shrinks: drop an entry when its duplicate goes, and a new
# duplicate fails until one side moves. cargo-deny warns about an entry that no longer matches.
skip = [
    { crate = "base64@0.22.1", reason = "via alacritty_terminal, hdrhistogram, hyper-util and more" },
    { crate = "bit-set@0.8.0", reason = "via fancy-regex" },
    { crate = "bit-vec@0.8.0", reason = "via bit-set" },
    { crate = "block-buffer@0.10.4", reason = "via digest" },
    { crate = "convert_case@0.10.0", reason = "via derive_more-impl" },
    { crate = "core-foundation@0.9.4", reason = "via cocoa, cocoa-foundation, core-graphics and more" },
    { crate = "cpufeatures@0.2.17", reason = "via aes, chacha20, curve25519-dalek and more" },
    { crate = "crypto-common@0.1.7", reason = "via aead, cipher, digest and more" },
    { crate = "digest@0.10.7", reason = "via ecdsa, elliptic-curve, hmac and more" },
    { crate = "font-types@0.11.3", reason = "via read-fonts" },
    { crate = "fontdb@0.23.0", reason = "via cosmic-text (gpui_wgpu), mermaid-rs-renderer" },
    { crate = "getrandom@0.2.17", reason = "via const-random-macro, loro-internal, rand_core and more" },
    { crate = "getrandom@0.3.4", reason = "via ahash, gpui, rand_core and more" },
    { crate = "harfrust@0.5.2", reason = "via cosmic-text (gpui_wgpu)" },
    { crate = "hashbrown@0.16.1", reason = "via accesskit_consumer, accesskit_macos and more" },
    { crate = "heck@0.4.1", reason = "via cbindgen, enum-as-inner, glib-macros" },
    { crate = "hmac@0.12.1", reason = "via hkdf, oo7, pbkdf2" },
    { crate = "miniz_oxide@0.8.9", reason = "via exr, png" },
    { crate = "objc2-app-kit@0.2.2", reason = "via accesskit_macos" },
    { crate = "objc2-foundation@0.2.2", reason = "via accesskit_macos, objc2-app-kit, objc2-core-data and more" },
    { crate = "objc2@0.5.3", reason = "via accesskit_macos, objc2-app-kit, objc2-foundation" },
    { crate = "pollster@0.2.5", reason = "via postage" },
    { crate = "quick-error@1.2.3", reason = "via rusty-fork" },
    { crate = "rand@0.8.8", reason = "via loro-internal, loro_fractional_index, phf_generator and more" },
    { crate = "rand@0.9.5", reason = "via gpui, num-bigint-dig, proptest" },
    { crate = "rand_chacha@0.3.1", reason = "via rand" },
    { crate = "rand_core@0.6.4", reason = "via crypto-bigint, crypto-common, elliptic-curve and more" },
    { crate = "rand_core@0.9.5", reason = "via rand, rand_chacha, rand_xorshift" },
    { crate = "read-fonts@0.37.0", reason = "via harfrust, skrifa" },
    { crate = "roxmltree@0.20.0", reason = "via fontconfig-parser" },
    { crate = "rustc-hash@1.1.0", reason = "via naga, wgpu-core" },
    { crate = "sha2@0.10.9", reason = "via onicode-client, onicode-engine, onicode-harness and more" },
    { crate = "skrifa@0.40.0", reason = "via cosmic-text" },
    { crate = "spin@0.9.9", reason = "via flume, heapless" },
    { crate = "syn@2.0.119", reason = "via arg_enum_proc_macro, asn1-rs-derive, asn1-rs-impl and more" },
    { crate = "synstructure@0.13.2", reason = "via asn1-rs-derive" },
    { crate = "system-configuration@0.6.1", reason = "via netdev" },
    { crate = "thiserror-impl@1.0.69", reason = "via thiserror" },
    { crate = "thiserror@1.0.69", reason = "via asn1-rs, cairo-rs, filedescriptor and more" },
    { crate = "toml_datetime@0.6.11", reason = "via toml, toml_edit" },
    { crate = "toml_edit@0.22.27", reason = "via toml" },
    { crate = "webpki-roots@0.26.11", reason = "via tokio-tungstenite" },
    { crate = "winnow@0.7.15", reason = "via toml_edit" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Every git dependency is a pinned rev. The forks onicode owns live under aislopware (gpui-fast); the rest are
# what gpui-fast pins by rev, named one by one (docs/onicode/upstream.md).
allow-git = [
    # gpui-fast's CoreText font loading (zed's fork of font-kit).
    "https://github.com/zed-industries/font-kit",
    # gpui-fast's renderer on Linux pins wgpu by rev.
    "https://github.com/gfx-rs/wgpu",
    # gpui-fast's keychain on Linux (zed's fork of oo7).
    "https://github.com/zed-industries/oo7",
]

[sources.allow-org]
github = ["aislopware"]
