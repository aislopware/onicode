# cargo-deny (scripts/dev/check.sh deny, the static CI job). Needs a settled Cargo.lock; builds nothing.

[graph]
# The platforms onicode builds for: macOS and iOS, nothing else (docs/onicode/decisions/platform.md).
targets = [
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Each ignored advisory names its id and why it cannot reach onicode.
ignore = [
    # Unmaintained, no maintained release to move to; each comes in through a third-party crate.
    { id = "RUSTSEC-2025-0141", reason = "bincode via heed-types (fff-search's LMDB index); fff-search pins heed 0.22" },
    { id = "RUSTSEC-2024-0436", reason = "paste via metal (gpui, core-video): a proc macro with no runtime code" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via mermaid-rs-renderer and its fontdb; successor skrifa not yet adopted there" },
    # Unsound APIs onicode never calls.
]

[licenses]
# Matched to the crates in Cargo.lock and THIRD_PARTY_NOTICES.md. A new license is a decision: add it here
# and to the notices in the same change.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "deny"
include-dev = true

[licenses.private]
# The workspace's own crates (publish = false) are MIT by LICENSE.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # rustls everywhere; no system OpenSSL.
    { crate = "native-tls", reason = "rustls everywhere; no system OpenSSL" },
    { crate = "openssl", reason = "rustls everywhere; no system OpenSSL" },
    { crate = "openssl-sys", reason = "rustls everywhere; no system OpenSSL" },
]
# Duplicates in the graph today. The list only shrinks: drop an entry when its duplicate goes, and a new
# duplicate fails until one side moves. cargo-deny warns about an entry that no longer matches.
skip = [
    { crate = "bit-set@0.8.0", reason = "via fancy-regex" },
    { crate = "bit-vec@0.8.0", reason = "via bit-set" },
    { crate = "convert_case@0.10.0", reason = "via derive_more-impl" },
    { crate = "core-foundation@0.9.4", reason = "via cocoa, cocoa-foundation, core-graphics and more" },
    { crate = "cpufeatures@0.2.17", reason = "via aes, chacha20, curve25519-dalek and more" },
    { crate = "fontdb@0.23.0", reason = "via mermaid-rs-renderer" },
    { crate = "getrandom@0.2.17", reason = "via const-random-macro, loro-internal, rand_core and more" },
    { crate = "getrandom@0.3.4", reason = "via ahash, gpui, rand_core and more" },
    { crate = "hashbrown@0.16.1", reason = "via accesskit_consumer, accesskit_macos and more" },
    { crate = "heck@0.4.1", reason = "via cbindgen, enum-as-inner, glib-macros" },
    { crate = "miniz_oxide@0.8.9", reason = "via exr, png" },
    { crate = "objc2-app-kit@0.2.2", reason = "via accesskit_macos" },
    { crate = "objc2-foundation@0.2.2", reason = "via accesskit_macos, objc2-app-kit, objc2-core-data and more" },
    { crate = "objc2@0.5.3", reason = "via accesskit_macos, objc2-app-kit, objc2-foundation" },
    { crate = "quick-error@1.2.3", reason = "via rusty-fork" },
    { crate = "rand@0.9.5", reason = "via gpui, scheduler, num-bigint-dig" },
    { crate = "rand_core@0.9.5", reason = "via rand, rand_chacha, rand_xorshift" },
    { crate = "roxmltree@0.20.0", reason = "via fontconfig-parser" },
    { crate = "serde_spanned@0.6.9", reason = "via toml 0.8 and toml_edit 0.22: cbindgen, a build dependency of gpui_apple" },
    { crate = "spin@0.9.9", reason = "via flume, heapless" },
    { crate = "syn@2.0.119", reason = "via arg_enum_proc_macro, asn1-rs-derive, asn1-rs-impl and more" },
    { crate = "toml@0.8.23", reason = "via cbindgen, a build dependency of gpui_apple" },
    { crate = "toml_datetime@0.6.11", reason = "via toml, toml_edit" },
    { crate = "winnow@0.7.15", reason = "via toml_edit" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Every git dependency is a pinned rev. The forks onicode owns live under aislopware (gpui-fast); the rest are
# what gpui-fast pins by rev, named one by one (docs/onicode/upstream.md).
allow-git = [
    # gpui-fast's CoreText font loading (zed's fork of font-kit).
    "https://github.com/zed-industries/font-kit",
]

[sources.allow-org]
github = ["aislopware"]
