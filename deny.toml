# cargo-deny (scripts/dev/check.sh deny, the static CI job). Needs a settled Cargo.lock; builds nothing.

[graph]
# The platforms onicode builds for: the macOS and iOS apps, and Linux for the cursory clippy lane.
targets = [
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Each ignored advisory names its id and why it cannot reach onicode.
ignore = [
    # Unmaintained, no maintained release to move to; each comes in through a third-party crate.
    { id = "RUSTSEC-2025-0141", reason = "bincode via heed-types (fff-search's LMDB index); fff-search pins heed 0.22" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps via im (loro-internal); loro pins im 15" },
    { id = "RUSTSEC-2026-0248", reason = "im via loro-internal; loro pins it" },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks via im (loro-internal); loro pins it" },
    { id = "RUSTSEC-2024-0384", reason = "instant via gpui-base and notify-types; wasm-only shim, a no-op re-export of std on macOS" },
    { id = "RUSTSEC-2024-0436", reason = "paste via metal (gpui, core-video): a proc macro with no runtime code" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via glib-macros (gtk 0.18, Linux file dialogs only); compile-time only" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 via stacksafe-macro; compile-time only" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via fontdb (cosmic-text) and usvg (gpui); successor skrifa not yet adopted upstream" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz in onicode-text and via usvg; the port to its successor harfrust is tracked in the rendering lane" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via serde_yaml_ng (harness skill frontmatter, small trusted local files)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via atspi (accesskit_unix): Linux accessibility only, Linux gets cursory support" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via atspi (accesskit_unix): Linux accessibility only" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via atspi (accesskit_unix): Linux accessibility only" },
    # Unsound APIs onicode never calls.
    { id = "RUSTSEC-2023-0126", reason = "im OrdSet via loro-internal; loro-internal uses only im's HashMap and HashSet, never OrdSet" },
    { id = "RUSTSEC-2026-0255", reason = "sized-chunks Chunk panic safety via im (loro); no fixed release, and loro pins im 15" },
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 VariantStrIter via gtk (Linux file dialogs); onicode never iterates GVariant strings" },
    # Vulnerabilities with no compatible fix in the dependent's pinned major.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via p256 in webrtc's rtc-dtls (preview); the fix is 0.7, which needs the elliptic-curve 0.14 stack webrtc has not moved to; DTLS runs only over the admitted tailnet" },
]

[licenses]
# Matched to the crates in Cargo.lock and THIRD_PARTY_NOTICES.md. A new license is a decision: add it here
# and to the notices in the same change.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "deny"
include-dev = true

[licenses.private]
# The workspace's own crates (publish = false) are MIT by LICENSE.
ignore = true

# webrtc-audio-processing ships WebRTC's BSD-3-Clause text as COPYING without a license field.
[[licenses.clarify]]
crate = "webrtc-audio-processing"
expression = "BSD-3-Clause"
license-files = []

[[licenses.clarify]]
crate = "webrtc-audio-processing-config"
expression = "BSD-3-Clause"
license-files = []

[[licenses.clarify]]
crate = "webrtc-audio-processing-sys"
expression = "BSD-3-Clause"
license-files = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # rustls everywhere. ort-sys's build-time ONNX Runtime download (ureq) is the one door to native-tls.
    { crate = "native-tls", wrappers = ["ureq"], reason = "rustls everywhere; no system OpenSSL" },
    { crate = "openssl", wrappers = ["native-tls"], reason = "rustls everywhere; no system OpenSSL" },
    { crate = "openssl-sys", wrappers = ["native-tls", "openssl"], reason = "rustls everywhere; no system OpenSSL" },
]
# Duplicates in the graph today. The list only shrinks: drop an entry when its duplicate goes, and a new
# duplicate fails until one side moves. cargo-deny warns about an entry that no longer matches.
