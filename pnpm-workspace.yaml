packages:
  - apps/*
  - evals
  - infra/*
  - oxlint-plugin-onicode
  - packages/*
  - scripts

# Successor to onlyBuiltDependencies/ignoredBuiltDependencies (pnpm 11+).
# true = allowed to run build scripts; false mirrors the pnpm 10 behavior
# where anything outside onlyBuiltDependencies was silently not built.
allowBuilds:
  # Platform binaries come from optional dependencies; the script only re-downloads them.
  "@sentry/cli": false
  # No install script since Electron 44; ensure:electron runs install.js.
  # Keep the key: pnpm fails installs that still record a removed `true`.
  electron: false
  electron-winstaller: false
  # Ships prebuilds; its host-architecture probe triggers source builds during cross-packaging.
  koffi: false
  node-pty: true
  # Ships N-API prebuilds; its install script only rebuilds from source.
  objc-js: false
  # Its postinstall only prints a banner.
  react-native-pdf-jsi: false
  "react-native-enriched-markdown@file:apps/mobile/deps/react-native-enriched-markdown-1.2.0-oni.31-6eac4eb0.tgz": true
  sharp: true
  # Verifies the workerd binary for the push gateway's local dev server.
  workerd: true

catalog:
  "@effect/atom-react": 4.1.7
  "@effect/graphql-generator": 4.1.7
  "@effect/openapi-generator": 4.1.7
  "@effect/platform-node": 4.1.7
  "@effect/platform-node-shared": 4.1.7
  "@effect/vitest": 4.1.7
  "@electron-webauthn/macos": 1.4.0
  "@legendapp/list": 3.9.2
  "@noble/hashes": 2.4.0
  "@pierre/diffs": 1.7.2
  "@pierre/highlights": 0.6.0
  "@pierre/trees": 1.0.0
  # @sentry/electron pins its core; desktop and server Sentry packages must resolve to that one copy.
  # Mobile's @sentry/react-native pins its own.
  "@sentry/core": 11.16.0
  "@sentry/electron": 8.5.0
  "@sentry/node": 11.16.0
  "@sentry/react": 11.16.0
  "@tailwindcss/node": 4.3.5
  "@tailwindcss/oxide": 4.3.5
  "@tailwindcss/vite": 4.3.5
  "@types/node": 26.6.11
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.3.0
  "@types/ws": 8.18.2
  effect: 4.1.7
  electron-webauthn: 1.4.0
  lightningcss: 1.33.0
  objc-js: 1.6.0
  pele: ^1.13.0
  plist: 5.1.2
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.5
  tldts: 7.6.2
  undici: 8.13.1
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0
  ws: 8.23.0
  yaml: ^2.9.1
  # Markdown pipeline: the server counts find matches with the same parser the
  # web renders with, so both must resolve to one version.
  mdast-util-directive: 3.2.1
  micromark-extension-directive: 4.0.0
  micromark-util-character: 2.1.1
  micromark-util-decode-string: 2.0.1
  micromark-util-types: 2.0.3
  rehype-raw: 7.0.0
  rehype-sanitize: 6.0.0
  remark-breaks: 4.0.0
  remark-gfm: 4.0.1
  remark-parse: 11.0.0
  remark-rehype: 11.1.2
  unified: 11.0.5

overrides:
  # Pin every patched package, including transitive dependencies, so lockfile-free
  # release installs cannot drift past the patch. Update these with patchedDependencies.
  react-native-image-viewing: 0.2.2
  "@exodus/bytes": 1.16.0
  mdast-util-math: 3.0.0
  micromark: 4.0.3
  mdast-util-to-hast: 13.2.2
  expo-audio: 58.0.12
  expo-network: 58.0.6
  expo-paste-input: 0.2.2
  "@cursor/sdk": 1.5.0
  expo-sharing: 58.0.24
  expo-widgets: 58.0.30
  "@ff-labs/fff-node": 0.11.0
  "@legendapp/list": 3.9.2
  "@pierre/diffs": 1.7.2
  "@react-native-menu/menu": 2.3.4
  "@react-navigation/native-stack": 7.21.1
  node-pty: 1.2.0-beta.18
  "@vitest/browser": 5.1.1
  react-native-gesture-handler: 3.5.0
  react-native-reanimated: 4.8.0
  react-native-worklets: 0.14.0
  react-native-keyboard-controller: 1.24.0
  react-native-webview: 14.0.1
  react-native-svg: 15.16.1
  react-native-pdf-jsi: 6.2.1
  app-builder-lib: 26.18.1
  electron-updater: 6.8.12
  expo-modules-core: 58.2.0
  expo-file-system: 58.0.15
  # Keep jsdom's optional peer consistent so Vite+ has one test-runner instance.
  "@exodus/bytes>@noble/hashes": "catalog:"
  # Earlier React Navigation declarations create a circular type alias in TypeScript 7.
  # Move this with @react-navigation/native: an older core than it requires crashes
  # every native stack at launch.
  "@react-navigation/core": 7.25.0
  # The SDK always receives the user's Claude executable, so its bundled binaries are unused.
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-darwin-arm64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-darwin-x64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-linux-arm64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-linux-arm64-musl": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-linux-x64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-linux-x64-musl": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-win32-arm64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-win32-x64": "-"
  "@effect/atom-react": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  "@expo/dom-webview": 58.0.2
  "@expo/metro-config": 58.0.24
  expo-constants: 58.0.16
  "expo-sharing>@expo/config-plugins": 58.0.13
  "expo-sharing>@expo/config-types": 58.0.3
  # Resolve below remark-math so Vite, Metro and Node use the same tokenizer.
  "remark-math>micromark-extension-math": npm:micromark-extension-llm-math@3.1.0
  # Its own ^0.16 is the last copy with GHSA-238p-pmpm-9mq7; share the one the web renders with.
  "micromark-extension-llm-math>katex": 0.19.1
  micromark-extension-gfm-table: 2.1.2
  # Keep one copy of these native-binary packages. lightningcss ships 11 platform binaries per
  # version, and the workspaces' tailwindcss ^4 ranges drift into two 4.3.x copies of the family.
  "@tailwindcss/node": "catalog:"
  "@tailwindcss/oxide": "catalog:"
  # Every platform we build on has a native oxide binary; since 4.3.5 the WASM fallback
  # installs everywhere and ships bundled dependencies without license files.
  "@tailwindcss/oxide>@tailwindcss/oxide-wasm32-wasi": "-"
  "@tailwindcss/vite": "catalog:"
  "@types/node": "catalog:"
  effect: "catalog:"
  # OpenCode 2's protocol and schema packages hard-pin an exact Effect version as a
  # dependency, and their schemas fail to decode under a second Effect copy.
  # The `effect` override above already collapses them; these name the edge so it
  # stays pinned on its own.
  "@opencode/protocol>effect": "catalog:"
  "@opencode/schema>effect": "catalog:"
  node-abi: 4.43.0
  # @expo/metro pins one exact Metro; React Native's ^ ranges would add a newer second copy.
  metro: 0.87.1
  metro-config: 0.87.1
  metro-core: 0.87.1
  metro-runtime: 0.87.1
  metro-source-map: 0.87.1
  metro-symbolicate: 0.87.1
  # react-native-worklets peers on any version, so a fresh resolve takes the newest
  # one; React Native's CLI plugin wants exactly its own. Move with react-native.
  "@react-native/metro-config": 0.88.1
  # The desktop app installs these without a lockfile when it packages them, so
  # pin the native passkey code that runs in its main process.
  "electron-webauthn>@electron-webauthn/macos": "catalog:"
  "@electron-webauthn/macos>objc-js": "catalog:"
  lightningcss: "catalog:"
  tailwindcss: "catalog:"
  # Ranges from @effect/platform-node, jsdom, unifont, Expo and libsql otherwise
  # settle on two patch releases of each major. Older majors stay as they are.
  "@types/ws@^8": "catalog:"
  "undici@^8": "catalog:"
  "ws@^8": "catalog:"
  vite: "catalog:"
  vite-plus: "catalog:"
  yaml: "catalog:"

packageExtensions:
  # Our patch makes @effect/vitest import vite-plus/test. A catalog: spec here
  # resolves through the vite-plus override above.
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"

patchedDependencies:
  # Mobile's GB18030 TextDecoder polyfill imports these typings; their unused Node reference would
  # give the React Native program Node's globals.
  "@exodus/bytes@1.16.0": patches/@exodus__bytes@1.16.0.patch
  react-native-image-viewing@0.2.2: patches/react-native-image-viewing@0.2.2.patch
  mdast-util-math@3.0.0: patches/mdast-util-math@3.0.0.patch
  micromark-extension-llm-math@3.1.0: patches/micromark-extension-llm-math@3.1.0.patch
  "@legendapp/list@3.9.2": patches/@legendapp__list@3.9.2.patch
  micromark-extension-gfm-table@2.1.2: patches/micromark-extension-gfm-table@2.1.2.patch
  micromark@4.0.3: patches/micromark@4.0.3.patch
  mdast-util-to-hast@13.2.2: patches/mdast-util-to-hast@13.2.2.patch
  expo-audio@58.0.12: patches/expo-audio@58.0.12.patch
  expo-video@58.0.14: patches/expo-video@58.0.14.patch
  expo-network@58.0.6: patches/expo-network@58.0.6.patch
  # iOS: announces an image read before its files exist, so a send can wait for it.
  expo-paste-input@0.2.2: patches/expo-paste-input@0.2.2.patch
  "@effect/vitest@4.1.7": patches/@effect__vitest@4.1.7.patch
  "@expo/metro-config@58.0.24": patches/@expo__metro-config@58.0.24.patch
  expo-sharing@58.0.24: patches/expo-sharing@58.0.24.patch
  expo-widgets@58.0.30: patches/expo-widgets@58.0.30.patch
  # Android: an RNHostView without a scrolling descendant (an app bar's buttons) is no longer the
  # scroll target a Material bottom sheet picks, so sheet content can sit below its header.
  "@expo/ui@58.0.30": patches/@expo__ui@58.0.30.patch
  "@ff-labs/fff-node@0.11.0": patches/@ff-labs__fff-node@0.11.0.patch
  # Exports the dependency-light subpaths mobile and the web diff parser import, re-measures
  # editor carets when the code font changes, stops the find bar reclaiming focus from the file,
  # and keeps drag selections intact across virtualized scroll renders.
  "@pierre/diffs@1.7.2": patches/@pierre__diffs@1.7.2.patch
  "@react-native-menu/menu@2.3.4": patches/@react-native-menu__menu@2.3.4.patch
  "@react-navigation/native-stack@7.21.1": patches/@react-navigation%2Fnative-stack@7.21.1.patch
  node-pty@1.2.0-beta.18: patches/node-pty@1.2.0-beta.18.patch
  react-native-gesture-handler@3.5.0: patches/react-native-gesture-handler@3.5.0.patch
  # Screens v5 stack, split and tab screens leave at once, like legacy screens. Exiting animations
  # inside one otherwise hold its removal for a later mount, after its stack has moved on.
  react-native-reanimated@4.8.0: patches/react-native-reanimated@4.8.0.patch
  # iOS: the frame queue's display link stays running through a few idle frames, so mappers fed by
  # scroll events no longer toggle it every vsync and halve ProMotion scrolling to 30 Hz.
  react-native-worklets@0.14.0: patches/react-native-worklets@0.14.0.patch
  react-native-keyboard-controller@1.24.0: patches/react-native-keyboard-controller@1.24.0.patch
  # Android: a nested WebView hands a vertical drag to its scrolling parent at the page's edge.
  react-native-webview@14.0.1: patches/react-native-webview@14.0.1.patch
  # Android: a Compose host that requests layout in a mount (a new screen's app bar) is laid out
  # before that frame is drawn, instead of a frame later.
  expo-modules-core@58.2.0: patches/expo-modules-core@58.2.0.patch
  # iOS: an upload creates the background session off the main actor and trips Swift's isolation check (expo/expo#54360).
  expo-file-system@58.0.15: patches/expo-file-system@58.0.15.patch
  app-builder-lib@26.18.1: patches/app-builder-lib@26.18.1.patch
  # The spawner takes an injected spawn function (and uses it for taskkill) so Windows launches
  # can run on worker threads: apps/server/src/process/SpawnWorker.ts.
  "@effect/platform-node-shared@4.1.7": patches/@effect__platform-node-shared@4.1.7.patch
  # The MCP Events extension (SEP-3415) on effect/ai, until Effect ships it.
  effect@4.1.7: patches/effect@4.1.7.patch
  # Electron net requests never emit "socket", so upstream's idle timeout never fires and a
  # stalled update download hangs forever.
  electron-updater@6.8.12: patches/electron-updater@6.8.12.patch
  # Android: a marker orient other than "auto" or a number (auto-start-reverse) no longer throws.
  react-native-svg@15.16.1: patches/react-native-svg@15.16.1.patch
  # Android: double-tap zoom no longer cancels itself, and taps near a link open it.
  react-native-pdf-jsi@6.2.1: patches/react-native-pdf-jsi@6.2.1.patch
  # Local agents expose agent.resume() (the protocol's ResumeAction), report startup progress,
  # offer background shells to the host, and refresh a cached model list on a miss.
  "@cursor/sdk@1.5.0": patches/@cursor__sdk@1.5.0.patch
  # A scenario screenshot no longer waits forever on the frame an Electron <webview> leaves in
  # its embedder: Playwright gets no script context for it, so its mask locator never resolves.
  "@e2e-dev/web@0.17.0": patches/@e2e-dev__web@0.17.0.patch
  # Android: a language change applies at once instead of reading back the old locale
  # before the async native write lands.
  gt-react-native@11.4.24: patches/gt-react-native@11.4.24.patch
  # An iOS scenario action waits out a runner still draining a command past its watchdog
  # (RUNNER_BUSY, nothing sent) within the action's timeout instead of failing the test.
  "@e2e-dev/mobile@0.12.9": patches/@e2e-dev__mobile@0.12.9.patch
  "@generaltranslation/format@0.1.11": patches/@generaltranslation__format@0.1.11.patch
  gt-i18n@1.0.45: patches/gt-i18n@1.0.45.patch
  # A browser test's first tester socket can close before opening on a busy runner; the
  # reconnect then opens but the tester keeps waiting on the dead attempt and fails after 60s.
  # https://github.com/vitest-dev/vitest/issues/10166
  "@vitest/browser@5.1.1": patches/@vitest__browser@5.1.1.patch
  # Hermes cannot parse the computed import for optional external codecs. Built-in ZIP codecs still work.
  "@zip.js/zip.js@2.25.0": patches/@zip.js__zip.js@2.25.0.patch

# Unmet peers fail resolution, so a pin outside a dependency's peer range is
# caught when the lockfile changes instead of scrolling past as a warning.
strictPeerDependencies: true

peerDependencyRules:
  allowAny:
    - typescript
  allowedVersions:
    # Our react-native-screens fork is a 5.x prerelease, which ">= 4.0.0" excludes.
    "@react-navigation/native-stack>react-native-screens": "*"

# pnpm 12 links agent skills that dependencies ship into .claude/skills once
# approved. We curate our own skills, so deny these to keep installs quiet.
permissions:
  "@tanstack/react-router":
    skills: false
  "@tanstack/router-plugin":
    skills: false
  drizzle-kit:
    skills: false
  e2e:
    skills: false
  expo-sqlite:
    skills: false

# @cursor/sdk finds its platform package (sandbox helper, rg, tree-sitter) by
# walking up from the entry script for node_modules/@cursor/sdk-<platform>-<arch>.
# pnpm keeps optional deps inside the virtual store, so hoist it to the root.
publicHoistPattern:
  - "@cursor/sdk-*"

