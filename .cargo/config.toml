# One feature set for every local and CI invocation, so a warm target dir builds only what changed
# (a different `-p` or feature set rebuilds dependencies and duplicates artifacts). Select tests with
# nextest's `-E 'rdeps(crate)'`, not `-p`.
[alias]
t = "nextest run --no-tests=fail --workspace --lib --bins --tests --features onicode-harness/native-fixture"
lint = "clippy --locked --workspace --all-targets --features onicode-harness/native-fixture -- -D warnings"
