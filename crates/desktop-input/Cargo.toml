[package]
name = "onicode-desktop-input"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Remote-desktop input on the host: CGEvent injection into a whole display on macOS (ported from slopty-input)"

[dependencies]
onicode-desktop-capture.workspace = true
onicode-desktop-proto.workspace = true
thiserror.workspace = true
# The pointer a cursor loop waits on (`pointer`).
tokio.workspace = true
# The Caps Lock claim every stream shares, and the input threads' census.
parking_lot.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
# Media keys' system-defined events (`backend`), and the live gesture test's own app following a
# swipe as Safari does (`tests/support/gesture_app.rs`).
objc2-app-kit = { workspace = true, features = ["block2"] }
block2.workspace = true
objc2-foundation.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
# Caps Lock through the HID system (`backend`).
objc2-io-kit.workspace = true
# The input thread's QoS class (`user_interactive_thread`): pthread/qos.h.
libc.workspace = true

[dev-dependencies]
# A live test's opt-in and skip, which the VM lane counts as a failure (`live`).
onicode-desktop-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }

# The live gesture test's own app, which it spawns and posts to: the one process a test here
# posts gestures to (`tests/inject.rs`).
[[bin]]
name = "onicode-gesture-app"
path = "tests/support/gesture_app.rs"
test = false
doc = false
bench = false
