[dependencies]
onicode-voice-media.workspace = true
onicode-voice-session.workspace = true
onicode-orb.workspace = true
onicode-veil.workspace = true
onicode-voice = { path = "../voice" }
url = "2"
onicode-proto.workspace = true
similar.workspace = true
onicode-doc.workspace = true
onicode-engine.workspace = true
onicode-harness.workspace = true
onicode-rpc.workspace = true
onicode-update.workspace = true
onicode-notify.workspace = true
onicode-syntax.workspace = true
onicode-theme.workspace = true
onicode-visual.workspace = true
onicode-visual-gpu.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
tokio-util.workspace = true
gpui-base.workspace = true
tokio.workspace = true
futures.workspace = true
reqwest.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
onicode-markdown.workspace = true
zatex = { workspace = true, features = ["bundled"] }
html5ever = "0.39"
onicode-term.workspace = true
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
] }
usvg = "0.48.1"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
unicode-segmentation.workspace = true
unicode-width.workspace = true
ttf-parser.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
sha2.workspace = true
roxmltree = "0.21.1"
png = "0.18"
thiserror.workspace = true
rust-embed = "=8.7.2"

[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "0.56", default-features = false, features = ["os-webview"] }
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSHapticFeedback",
    "NSBitmapImageRep",
    "NSImage",
    "NSEvent",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGDirectDisplay",
    "CGEvent",
    "CGEventTypes",
] }
objc2-web-kit = { version = "0.3.2", features = [
    "WKWebView",
    "WKNavigationDelegate",
    "WKNavigationAction",
    "WKSnapshotConfiguration",
] }
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["elcapitan", "highsierra", "link"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = [
    "async-io",
    "global_shortcuts",
    "screenshot",
    "settings",
] }
atspi = { version = "0.30.0", features = ["zbus"] }
async-io = "2"
url = "2"
x11rb = { version = "0.14.0", features = ["image"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
mimalloc.workspace = true
tracing-subscriber.workspace = true
