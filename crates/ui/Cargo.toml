[package]
name = "onicode-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
voice-experimental = [] # Compatibility flag; native subscription voice uses Codex's packaged helper.
project-palette-fixture = []
# New project's typed path against a real engine, filmed in process.
project-path-fixture = ["gpui_platform/test-support"]
compact-picker-fixture = ["gpui_platform/test-support"]
browser-fixture = []
appshots-fixture = ["gpui_platform/test-support"]
pull-request-fixture = ["gpui_platform/test-support"]
resource-profile = ["gpui/bench", "gpui_platform/test-support"]

[[example]]
name = "macos-resource-profile"
required-features = ["resource-profile"]

[[example]]
name = "preview-fixture"
required-features = ["browser-fixture"]

[[example]]
name = "browser-fixture"
required-features = ["browser-fixture"]

[[example]]
