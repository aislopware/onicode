[package]
name = "onicode-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The engine-free thin client ("viewer device"): workspace registry, chat2
# session docs, the durable command ledger and host RPC over the device-room
# relay, plus a fully offline Demo mode. Pure Rust — the UniFFI facade lives
# in crates/mobile (`client_ffi`), so this crate stays usable from any
# frontend (iOS, Android, tests, CLIs).

[dependencies]
onicode-voice-session.workspace = true
onicode-proto.workspace = true
onicode-doc.workspace = true
onicode-sync.workspace = true
onicode-rpc.workspace = true
onicode-peer.workspace = true
onicode-net.workspace = true
onicode-term-link.workspace = true
loro.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
sha2.workspace = true
base64 = "0.22"
async-trait.workspace = true

[dev-dependencies]
tempfile.workspace = true
onicode-visual.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["test-util"] }
