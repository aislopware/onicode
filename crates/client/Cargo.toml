[package]
name = "onicode-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The engine-free thin client ("viewer device"): workspace registry, session
# docs, the durable command ledger and host RPC over peer links on the
# tailnet, plus a fully offline Demo mode. Pure Rust — the UniFFI facade lives
# in crates/mobile (`client_ffi`), so this crate stays usable from any
# frontend (iOS, Android, tests, CLIs).

[dependencies]
onicode-voice-session.workspace = true
onicode-proto.workspace = true
onicode-doc.workspace = true
onicode-sync.workspace = true
onicode-rpc.workspace = true
onicode-desktop-link.workspace = true
onicode-peer.workspace = true
onicode-net.workspace = true
onicode-tailnet.workspace = true
onicode-term-link.workspace = true
loro.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
onicode-visual.workspace = true
tokio = { workspace = true, features = ["test-util"] }
