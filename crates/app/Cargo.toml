[package]
name = "onicode"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
onicode-core = { path = "../core" }
# Turns run in the engine library, in process until the engine runs on its own (engine.md).
onicode-engine.workspace = true
# Local turns run in the engine's SessionHub, watched and driven over the in-memory transport.
onicode-protocol.workspace = true
onicode-rpc.workspace = true
futures.workspace = true
# Onicode's updater: the release feed, staging and the bundle swap. Its async
# calls run on a current-thread tokio runtime inside a background task.
onicode-update = { path = "../update" }
tokio.workspace = true
log = "0.4"
pulldown-cmark.workspace = true
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders"] }
unicode-segmentation = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-channel = "2"
base64 = "0.23.1"
# Attachment chips build their thumbnail sprites directly.
image = { version = "0.25", default-features = false }
# The terminal dock's mirror of the engine's terminal, its keys, links and labels.
onicode-term.workspace = true
# The memory log's `proc_pid_rusage`.
libc = "0.2"
rquickjs = "0.14.0"
# The file editor's native syntax: incremental parses, highlights, folds and
# syntax errors. Languages without a grammar here use the QuickJS fallback.
tree-sitter = "0.27.1"
tree-sitter-language = "0.1"
streaming-iterator = "0.1"
similar.workspace = true
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-ruby = "0.23"
tree-sitter-zig = "1.1"
# Settings → Mobile draws the pairing code from the module matrix.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

# The GPU memory snapshot for the memory log, and CoreText for text drawn outside a window.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_apple = { workspace = true, features = ["font-kit"] }
# Pins the native traffic lights to the Tauri app's spacing.
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSEvent",
    "NSApplication",
    "NSDockTile",
    "NSButton",
    "NSControl",
    "NSLayoutAnchor",
    "NSLayoutConstraint",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSMenu",
    "NSMenuItem",
    "NSImage",
] }
raw-window-handle = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSGeometry",
    "NSData",
    "NSRange",
    "NSArray",
    "NSSet",
    "NSError",
    "NSBundle",
] }
objc2-user-notifications = "0.3"
# libmalloc keeps freed large spans dirty, so startup and image churn stayed
# resident. mimalloc 3 retains churn the same way; the v2 feature pins 2.x.
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { workspace = true, features = ["font-kit", "test-support", "runtime_shaders"] }
# Golden images (src/shell/golden_tests.rs): the headless Metal renderer, and PNG files.
gpui_platform = { workspace = true, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
parking_lot = "0.12"
