[package]
name = "onicode-term-link"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Terminals on other devices, for every viewer (the desktop engine and the phone alike): a
# terminal's stream on the peer link to its host, and the hub that numbers input and resumes a
# dropped stream with no gap, no repeat and no lost keystroke.
[dependencies]
onicode-net.workspace = true
onicode-peer.workspace = true
onicode-proto.workspace = true
onicode-rpc.workspace = true
bytes.workspace = true
tokio.workspace = true
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
base64 = "0.22"

[dev-dependencies]
noq.workspace = true
onicode-net-sim.workspace = true
tokio = { workspace = true, features = ["test-util"] }
