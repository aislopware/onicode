[package]
name = "onicode-term"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The terminal core on libghostty-vt: the engine's host terminal over a PTY, and the mirror a viewer paints (docs/onicode/decisions/terminal.md)"

[dependencies]
libghostty-vt.workspace = true
# The PTY (openpty, the controlling terminal, its size and foreground group) and the hangup a
# closing shell and a stopped job expect.
libc.workspace = true
# The input and size types the engine encodes and the viewers send.
onicode-protocol.workspace = true

[dev-dependencies]
proptest.workspace = true
