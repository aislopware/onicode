[package]
name = "onicode-core"
version.workspace = true
publish = false
edition = "2021"
license.workspace = true

[dependencies]
# The data and pure helpers core reads and writes; each core module re-exports its twin.
onicode-protocol.workspace = true
serde.workspace = true
# Stored floats must reload exactly, or saved revisions stop matching.
serde_json = { workspace = true, features = ["float_roundtrip"] }
rusqlite.workspace = true
async-channel = "2"
url = "2"
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sha2.workspace = true
base16ct.workspace = true
rand = "0.10.3"
regex = "1"
zstd = "0.14.3"
# Codex's config.toml under TOML 1.1; parse only, nothing writes TOML.
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }
ureq = "3.5.1"
# The OpenCode event stream's own TLS socket, on the provider and roots ureq uses.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.11"
# `serde`: a prompt row carries its protocol `MessageId`; `v7`: the session uids the engine mints.
uuid = { version = "1", features = ["v7", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
rquickjs = "0.14.0"
tempfile = "3"
libc = "0.2"

[dev-dependencies]
proptest.workspace = true
tempfile = "3"
