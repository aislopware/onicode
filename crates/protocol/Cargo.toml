[package]
name = "onicode-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The calls and watches onicode's viewers speak to engines: plain serde types, no IO (docs/onicode/decisions/engine.md)"

[dependencies]
# `files::Bytes`: file contents as one base64 string, not a JSON array of numbers.
base64 = "0.23.1"
# Timestamps the inbox, reminders and usage meters parse, and the local day the filters start at.
chrono.workspace = true
# Searches, links, version strings and the provider text the transcript parses.
regex = "1"
serde.workspace = true
# Stored floats must reload exactly, or saved revisions stop matching.
serde_json = { workspace = true, features = ["float_roundtrip"] }
# A tool call's shell command, split as the shell would.
shlex = "2"
# `diff`: a turn's line changes.
similar.workspace = true
unicode-width.workspace = true
url = "2"
# `v4`: random ids (accounts, notes, automations); `v7`: ids minted by whoever creates the thing
# sort by when they were minted.
uuid = { workspace = true, features = ["v7"] }

[target.'cfg(unix)'.dependencies]
# `response::local_clock`: the local wall clock without a time-zone database of our own.
libc.workspace = true

[dev-dependencies]
proptest.workspace = true
serde-reflection.workspace = true
serde_json.workspace = true
