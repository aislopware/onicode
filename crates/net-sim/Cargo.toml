[package]
name = "onicode-net-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A seeded in-memory network on tokio's paused clock, and a simulated tailnet on it, for deterministic transport tests"

[dependencies]
async-trait.workspace = true
noq.workspace = true
onicode-tailnet.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
