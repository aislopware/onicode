[package]
name = "onicode-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
onicode-launch.workspace = true
# Host-side answers to terminal queries (terminals/replies.rs).
alacritty_terminal.workspace = true
onicode-preview.workspace = true
onicode-proto.workspace = true
onicode-doc.workspace = true
onicode-sync.workspace = true
onicode-harness.workspace = true
semver = "1"
onicode-rpc.workspace = true
onicode-net.workspace = true
onicode-peer.workspace = true
onicode-tailnet.workspace = true
onicode-update.workspace = true
onicode-notify.workspace = true
onicode-visual.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
onicode-term-link.workspace = true
# Remote desktop: the broker's types and its line to desktopd (`desktop.rs`).
onicode-desktop-link.workspace = true
# The clipboard that follows the owner between machines (`clipboard.rs`).
onicode-clipboard.workspace = true
# Files between peers and path browsing (`transfers.rs`, `paths.rs`).
onicode-transfer.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
toml = "0.8"
libc.workspace = true
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2.workspace = true
reqwest.workspace = true
ignore.workspace = true
fff-search.workspace = true

same-file = "1"
tempfile.workspace = true
# `show_image` reads a shown image's size from its header (already in the
# tree with these decoders via onicode-ui).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# The helper's launchd label and its panes' links (`desktop.rs`), and the paste permission
# (`clipboard.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
onicode-grants.workspace = true
# The app's bundle id, which names desktopd's launchd label (`desktop.rs`).
plist.workspace = true

[dev-dependencies]
# The keep-awake machine's property tests.
proptest.workspace = true
# A thin client joining an engine by a listed address (tests/thin_client.rs).
onicode-client.workspace = true
onicode-net-sim.workspace = true
noq.workspace = true
tracing-subscriber.workspace = true
onicode-mcp.workspace = true
onicode-harness = { workspace = true, features = ["installer-fixture"] }
# Paused-clock tests (the 30-minute idle reaper).
tokio = { workspace = true, features = ["test-util"] }
zip.workspace = true
# A registry build of the fake ACP agent (tests/acp_registry_rpc.rs).
tar = "0.4"
flate2 = "1"
