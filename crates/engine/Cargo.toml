[package]
name = "onicode-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "onicode's engine: the work behind every viewer, one process per machine (docs/onicode/decisions/engine.md)"

# The machine's engine process, shipped beside the app ("Onicode Engine" in the bundle).
[[bin]]
name = "onicode-engine"
path = "src/bin/onicode-engine.rs"

[dependencies]
async-channel = "2"
# The Session group's service (`session::SessionService`).
async-trait.workspace = true
# The hub's spawned work and its watch streams; `executor` drives `ThreadSpawn`.
futures.workspace = true
# The instance lock (`flock`), stopping an engine of another build (`kill`), the peer's uid.
libc.workspace = true
# The Files and Git watches' platform file watch (FSEvents on macOS).
notify = "8.2"
onicode-core.workspace = true
# A viewer's link starts the engine beside the app, detached.
onicode-launch.workspace = true
onicode-protocol.workspace = true
onicode-rpc.workspace = true
# The Terminal group's host terminal, PTY and login shell.
onicode-term.workspace = true
serde.workspace = true
serde_json.workspace = true
# `sync`: a watcher's wake-up and a deferred receipt, on whichever executor polls them. The rest
# for the engine process and a viewer's link: the socket, its runtime, timers and signals.
tokio = { workspace = true, features = ["sync", "net", "rt-multi-thread", "time", "signal"] }
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# `rt` and `macros`: the service's tests drive `memory_client` on a current-thread runtime;
# `test-util`: the link's model runs in paused, virtual time.
tokio = { workspace = true, features = ["sync", "rt", "macros", "test-util"] }
