[package]
name = "onicode-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "onicode's engine: the work behind every viewer, one process per machine (docs/onicode/decisions/engine.md)"

# The machine's engine process, shipped beside the app ("Onicode Engine" in the bundle).
[[bin]]
name = "onicode-engine"
path = "src/bin/onicode-engine.rs"

[dependencies]
async-channel = "2"
# The Session group's service (`session::SessionService`).
async-trait.workspace = true
# The hub's spawned work and its watch streams; `executor` drives `ThreadSpawn`.
futures.workspace = true
# The instance lock (`flock`), stopping an engine of another build (`kill`), the peer's uid.
libc.workspace = true
# The Files and Git watches' platform file watch (FSEvents on macOS).
notify.workspace = true
onicode-core.workspace = true
# The Desktop group (`desktop`): desktopd's control socket and its broker answers.
onicode-desktop-link.workspace = true
# A viewer's link starts the engine beside the app, detached.
onicode-launch.workspace = true
# The engine on the tailnet (`peers`): its QUIC endpoint, peers' hellos and the stream heads.
onicode-net.workspace = true
# Its endpoint, directory and links: forwarded calls and watches (`router`), and `WatchMachines`.
onicode-peer.workspace = true
onicode-protocol.workspace = true
onicode-rpc.workspace = true
# The system Tailscale daemon the engine joins the tailnet through.
onicode-tailnet.workspace = true
# The Terminal group's host terminal, PTY and login shell.
onicode-term.workspace = true
serde.workspace = true
serde_json.workspace = true
# `sync`: a watcher's wake-up and a deferred receipt, on whichever executor polls them. The rest
# for the engine process and a viewer's link: the socket, its runtime, timers and signals.
tokio = { workspace = true, features = ["sync", "net", "rt-multi-thread", "time", "signal"] }
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The Desktop group: desktopd's launchd label (`bundle::helper_id`) and System Settings at a pane.
onicode-grants.workspace = true
# The engine's own banners while no viewer presents its alerts (`alerts::SystemBanners`).
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSBundle", "NSString"] }
objc2-user-notifications = { workspace = true, features = [
    "block2",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[dev-dependencies]
# Engines, an app and a phone on a simulated tailnet, in virtual time (`tests/peers.rs`).
onicode-net-sim.workspace = true
proptest.workspace = true
tempfile.workspace = true
# `rt` and `macros`: the service's tests drive `memory_client` on a current-thread runtime;
# `test-util`: the link's model runs in paused, virtual time.
tokio = { workspace = true, features = ["sync", "rt", "macros", "test-util"] }
