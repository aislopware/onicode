[package]
name = "onicode-visual-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "GPU rendering for agent visuals: shaders and 3D scenes drawn offscreen with wgpu"

[dependencies]
onicode-visual.workspace = true
# GPUI's own wgpu (see the workspace table); here it draws offscreen.
wgpu = { workspace = true, features = ["glsl"] }
pollster = "0.4"
tracing.workspace = true

[dev-dependencies]
# Test textures and environment maps.
image = { version = "0.25.10", default-features = false, features = ["png"] }
