[package]
name = "onicode-desktop-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Remote-desktop capture: whole displays through ScreenCaptureKit, the synthetic canvas, the cursor (ported from slopty-capture)"

[dependencies]
onicode-desktop-proto.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
# `dlsym` for the window server's cursor calls (`cursor.rs`).
libc.workspace = true
objc2.workspace = true
# `block2` and `objc2-core-foundation` for the picture `tests/support/cursor_app.rs` draws; the
# `NSCursor` the cursor test reads the old way; `NSScreen` for the curtain's shield windows, one
# over each screen (`shield`).
objc2-app-kit = { workspace = true, features = ["block2", "objc2-core-foundation", "NSScreen"] }
objc2-core-audio-types.workspace = true
objc2-core-foundation.workspace = true
# `CGDisplayStream` for the `kCGDisplayStreamYCbCrMatrix_*` values SCStream's colorMatrix takes,
# `CGColor` for the black its backgroundColor paints a padded surface with, `CGSession` for
# whether the Mac is locked or this session is off its screens (`console`).
objc2-core-graphics = { workspace = true, features = ["CGDisplayStream", "CGColor", "CGSession"] }
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-foundation.workspace = true
# The power assertion that keeps the displays awake while a viewer watches (`awake`).
objc2-io-kit = { workspace = true, features = ["pwr_mgt"] }
objc2-screen-capture-kit.workspace = true
onicode-desktop-codec.workspace = true
parking_lot.workspace = true
tracing.workspace = true

# The app `tests/cursor.rs` reads a cursor of known colours from: a test app, never installed.
[[bin]]
name = "onicode-cursor-app"
path = "tests/support/cursor_app.rs"
test = false
doc = false
bench = false

[dev-dependencies]
# A live test's skip (`onicode_desktop_testkit::live::skip`).
onicode-desktop-testkit.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-video.workspace = true
