[package]
name = "onicode-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Synthetic native protocol peer for subprocess tests; never part of a normal build.
native-fixture = []
# Explicit installer injection for integration tests; never enabled in the app.
installer-fixture = []

[[bin]]
name = "harness-native-fixture"
path = "tests/fixtures/native_agent.rs"
required-features = ["native-fixture"]

[[bin]]
name = "harness-pi-fixture"
path = "tests/fixtures/pi_rpc.rs"
required-features = ["native-fixture"]

[dependencies]
onicode-voice-media.workspace = true
onicode-proto.workspace = true
base64 = "0.22"
reqwest.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["io-util", "codec"] }
uuid.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
deser-hjson.workspace = true
serde_yaml_ng = "0.10"
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
semver = "1"
chrono.workspace = true
filetime = "0.2"
zip.workspace = true
# ACP registry builds ship as .tar.gz / .tar.bz2 as well as .zip.
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
onicode-doc.workspace = true
tempfile.workspace = true
anyhow.workspace = true
