[package]
name = "onicode-clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The clipboard that follows the owner between machines: the pasteboard seam, offers announced on a change and fetched lazily on paste, private and loop-free"

[dependencies]
async-trait.workspace = true
# An offer's inline bytes (`onicode_proto::clipboard::ClipboardType::inline`).
base64 = "0.22"
# `Clipboard::subscribe`'s stream.
futures.workspace = true
onicode-proto.workspace = true
parking_lot.workspace = true
# `PasteAccess`, as an engine reports it.
serde.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# `serve_main_run_loop`: whether this is the main thread.
libc.workspace = true
objc2.workspace = true
# NSPasteboard and its items' data providers (`MacBoard`).
objc2-app-kit.workspace = true
# The main run loop a waiting promise serves (`serve_main_run_loop`).
objc2-core-foundation.workspace = true
# A copied file named by reference resolved to its path (`MacBoard::data`).
objc2-foundation = { workspace = true, features = ["NSURL"] }

[dev-dependencies]
# The opt-in for tests that touch a real (named) pasteboard.
onicode-desktop-testkit.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
