[package]
name = "onicode-tailnet"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The local Tailscale daemon through its LocalAPI: peers, paths, who is calling, and changes as they happen"

[features]
# `fake`: a stand-in LocalAPI on loopback, for the tests of crates that read Tailscale.
fake = ["hyper/server"]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# The App Store Tailscale's LocalAPI is named only by a file its extension holds open
# (`proc_files`, read through libproc).
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[dev-dependencies]
hyper = { workspace = true, features = ["server"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
