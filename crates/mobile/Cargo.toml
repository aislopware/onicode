[package]
name = "onicode-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The mobile core: one UniFFI library that iOS (Swift) and Android (Kotlin)
# link. Platform code paints, scrolls and handles gestures; everything that
# decides *what* to paint and *where* lives here.
[lib]
name = "onicode_mobile"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
onicode-voice-session.workspace = true
onicode-orb.workspace = true
onicode-veil.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
uniffi = "0.32"
onicode-markdown.workspace = true
onicode-text.workspace = true
onicode-visual.workspace = true
onicode-visual-gpu.workspace = true
onicode-doc.workspace = true
onicode-proto.workspace = true
onicode-client.workspace = true
onicode-desktop-client.workspace = true
onicode-desktop-link.workspace = true
onicode-desktop-media.workspace = true
onicode-desktop-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
onicode-syntax.workspace = true
zatex = { workspace = true, features = ["bundled"] }
thiserror.workspace = true
onicode-term.workspace = true
