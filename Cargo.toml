[workspace]
resolver = "2"
members = [
    # The app and its core, from monocode native 0.16.0-preview.14 (docs/onicode/decisions/monocode-base.md).
    "crates/app",
    "crates/core",
    # The engine and the protocol its viewers speak (docs/onicode/decisions/engine.md).
    "crates/engine",
    "crates/protocol",
    # The terminal core: the engine's host terminal and the mirror the app paints.
    "crates/term",
    "crates/rpc",
    "crates/update",
    "crates/launch",
    # Peer transport over the tailnet (.research/p2p-transport.md §5.1).
    "crates/net",
    "crates/net-sim",
    "crates/tailnet",
    "crates/peer",
    # Remote desktop (.research/remote-desktop.md §5).
    "crates/desktop-media",
    "crates/desktop-proto",
    "crates/desktop-codec",
    "crates/desktop-capture",
    "crates/desktop-input",
    "crates/desktop-vdisplay",
    "crates/desktop-testkit",
    # Remote desktop's session, host and client (orchestration over the crates above).
    "crates/desktop-link",
    "crates/desktopd",
    "crates/desktop-client",
    # The clipboard that follows a desktop window: the pasteboard, offers and lazy fetches.
    "crates/clipboard",
    # Every privilege onboarding asks for, and the drag-into-System-Settings guide.
    "crates/grants",
]
# The vendored QUIC crates are workspace roots of their own, reached only through
# [patch.crates-io] below.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
onicode-core = { path = "crates/core" }
onicode-rpc = { path = "crates/rpc" }
# The engine and the protocol its viewers speak (docs/onicode/decisions/engine.md).
onicode-engine = { path = "crates/engine" }
onicode-protocol = { path = "crates/protocol" }
onicode-term = { path = "crates/term" }
# How the app starts the engine beside it, detached.
onicode-launch = { path = "crates/launch" }

# Peer transport over the tailnet (.research/p2p-transport.md §5.1).
onicode-net = { path = "crates/net" }
onicode-net-sim = { path = "crates/net-sim" }
onicode-peer = { path = "crates/peer" }
onicode-tailnet = { path = "crates/tailnet" }
zstd = "=0.14.3"
# Remote desktop (.research/remote-desktop.md §5): slopty's media, codec, capture, input and
# virtual-display crates, ported whole.
onicode-desktop-media = { path = "crates/desktop-media" }
onicode-desktop-proto = { path = "crates/desktop-proto" }
onicode-desktop-codec = { path = "crates/desktop-codec" }
onicode-desktop-capture = { path = "crates/desktop-capture" }
onicode-desktop-input = { path = "crates/desktop-input" }
onicode-desktop-vdisplay = { path = "crates/desktop-vdisplay" }
# Remote desktop's session envelope and its client.
onicode-desktop-link = { path = "crates/desktop-link" }
onicode-desktop-client = { path = "crates/desktop-client" }
# The clipboard that follows a desktop window, on both ends of the desktop link.
onicode-clipboard = { path = "crates/clipboard" }
# The desktop crates' tests only: live-test skips, percentiles, benches, SoC counters.
onicode-desktop-testkit = { path = "crates/desktop-testkit" }
# Onboarding's privileges: the checklist, the helper's fresh-process probe, the drag guide.
onicode-grants = { path = "crates/grants" }
# Apple frameworks for the desktop crates: the objc2 0.6 family at its newest (crates.io,
# 2026-11-06), pinned exact as slopty pinned it, the versions gpui-fast already locks so the graph
# holds one of each. Feature lists are trimmed to the headers the desktop crates call.
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDate",
    "NSGeometry",
    "NSRunLoop",
    "NSError",
    "NSString",
    "NSObject",
    "NSEnumerator",
    "NSProcessInfo",
] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFBase",
    "CFDictionary",
    "CFNumber",
    "CFString",
    "CFCGTypes",
    "CFDate",
    "CFRunLoop",
] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CMBase",
    "CMTime",
    "CMSampleBuffer",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMAttachment",
    "CMSync",
    "objc2-core-video",
    "objc2-core-audio-types",
] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVPixelBufferIOSurface",
    "CVReturn",
    "objc2-core-graphics",
] }
objc2-video-toolbox = { version = "=0.3.2", default-features = false, features = [
    "std",
    "VTBase",
    "VTSession",
    "VTErrors",
    "VTCompressionSession",
    "VTCompressionProperties",
    "VTDecompressionSession",
    "VTDecompressionProperties",
    "objc2-core-media",
    "objc2-core-video",
] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "SCStream",
    "SCScreenshotManager",
    "SCShareableContent",
    "SCError",
    "block2",
    "dispatch2",
    "libc",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CGBase",
    "CGGeometry",
    "CGImage",
    "CGDataProvider",
    "CGDirectDisplay",
    "CGWindow",
    "CGWindowLevel",
    "CGEvent",
    "CGEventTypes",
    "CGEventSource",
    "CGRemoteOperation",
    "CGError",
    "libc",
] }
objc2-application-services = { version = "=0.3.2", default-features = false, features = ["std", "HIServices", "libc"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSColor",
    "NSCursor",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-graphics",
    "libc",
] }
objc2-audio-toolbox = { version = "=0.3.2", default-features = false, features = [
    "std",
    "AUComponent",
    "AudioComponent",
    "AudioConverter",
    "AudioOutputUnit",
    "AudioServices",
    "AudioUnitProperties",
    "objc2-core-audio-types",
    "objc2-core-foundation",
] }
objc2-core-audio = { version = "=0.3.2", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-audio-types = { version = "=0.3.2", default-features = false, features = ["std"] }
# Caps Lock through the HID system's parameter connection (`onicode_desktop_input::backend`).
objc2-io-kit = { version = "=0.3.2", default-features = false, features = ["std", "hidsystem", "libc"] }
# The engine's own banners (`onicode_engine::alerts::SystemBanners`); the version gpui-fast already
# locks.
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std"] }
block2 = "=0.6.2"
# The audio ring model-checked over every interleaving (`onicode-desktop-codec`, `--cfg
# onicode_loom` only); the version the graph already locks.
loom = "0.7.2"
dispatch2 = "=0.3.1"
# The modifier set on a key or a click (`onicode_desktop_proto::input::Mods`); the version the
# graph already locks.
bitflags = { version = "2.13.2", features = ["serde"] }
# A cursor picture's pixels as one byte string (`onicode_desktop_proto::screen::CursorShape`); the
# version the graph already locks.
serde_bytes = "0.11.19"
# Systematic Reed–Solomon parity for video frames (NEON on Apple silicon).
reed-solomon-simd = "3.1.0"
# Fixed little-endian wire layouts read in place. 0.9 is an alpha with a new API and no measured
# gain here.
zerocopy = { version = "0.8.63", features = ["derive"] }
# n0's QUIC, held to 1.4.x: noq-proto and noq-udp are the vendored, patched copies
# (vendor/*/SLOPTY.md), and the patches are written against 1.4.0.
noq = { version = "~1.4.0", default-features = false, features = ["runtime-tokio"] }
noq-proto = { version = "1.4.0", default-features = false }
bytes = "1.12"
# Held at 0.12: 0.13 measured slower with two to four threads on one lock (two threads, 200k short
# critical sections each: 18 ms against 5.7 ms for a Mutex), faster only from eight threads up, and
# would sit beside the 0.12 that tokio and gpui lock.
parking_lot = "0.12.5"
# `all`: binding a socket to the tailnet's interface (`bind_device_by_index_v4`/`_v6`).
socket2 = { version = "0.6.5", features = ["all"] }
# Tailscale's LocalAPI is HTTP/1.1 over a Unix socket or loopback TCP.
hyper = "1.12"
hyper-util = "0.1.21"
http-body-util = "0.1.5"
# Property and model tests; the version noq-proto's tests already lock.
proptest = "1.12"
pretty_assertions = "1.4.1"
# Structured fuzz inputs; desktop-media's tests replay its fuzz corpora through them.
arbitrary = { version = "1.5.0", features = ["derive"] }
# The protocol's golden table (onicode-protocol's tests): the serde shape of every call and watch,
# traced through the real Serialize/Deserialize impls, so a change no hand-written description
# mentions still fails until PROTOCOL is bumped. Newest on crates.io (2026-05-26); test-only.
serde-reflection = "=0.6.0"

# diffs
similar = "3.2.1"

# async / net
tokio = { version = "1", features = ["full"] }
libc = "0.2"
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# GPUI is aislopware/gpui-fast (retained mode, list and scroll layers), pinned by rev on its main: the rev
# that carries monocode's renderer parity (backdrop blur, linear edge fades and text reveal, rounded clip, the
# project background's layer mask, drop shadows outside, 3:2 dashes, role cursor, wheel glide, content zoom,
# atlas clear, group fades, whole blurs ordered as monocode's marker, cached views snapped from their bounds,
# first runs shaped at next_up; its FORK.md "Onicode"), so the app draws as monocode's patched GPUI snapshot did
# (docs/onicode/golden.md). Since 2026-11-07 it also carries rune's idle ideas: a frame drawn the same as the one
# shown is not presented, debug churn warnings, and the motion gate for tests (docs/onicode/decisions/rendering.md);
# and fast::app_init, so gpui-kit sets itself up for every App, test apps included.
gpui = { git = "https://github.com/aislopware/gpui-fast", rev = "fcf3df54371dce79931653322524881b6dc80121", default-features = false }
gpui_platform = { git = "https://github.com/aislopware/gpui-fast", rev = "fcf3df54371dce79931653322524881b6dc80121", default-features = false }
# The headless Metal renderer, the CoreText text system and the GPU memory snapshot.
gpui_apple = { git = "https://github.com/aislopware/gpui-fast", rev = "fcf3df54371dce79931653322524881b6dc80121" }

# The component library (docs/onicode/decisions/rendering.md): aislopware's gpui-kit fork on the same
# gpui-fast rev, wearing monocode's look; monocode's widgets move onto it one primitive at a time.
gpui-component = { git = "https://github.com/aislopware/gpui-kit", rev = "98152f9d710347105f5e3f4393949efb37c331ea" }

# storage
# `bundled`: one SQLite on every platform, not whichever the OS ships. `hooks`: a search a newer
# keystroke cancelled interrupts its query (`progress_handler`). No statement cache: the store
# prepares per call.
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"], default-features = false }

# misc
# Global allocator: libmalloc retains the churn high-water mark as permanent
# RSS - measured as the top residency cause in docs/memory-plan.md. Pinned to
# mimalloc v2: the crate's default (v3.3.2) has the same watermark pathology
# itself - transient streaming/render churn became permanent RSS (~6x glibc
# growth, daemon at 908MB for 7.3MB of docs, no idle recovery).
mimalloc = { version = "0.1", features = ["v2"] }
anyhow = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
# Digests; sha2 0.11 is the one p256 already locks.
sha2 = "0.11.1"
# A digest as lowercase hex: digest 0.11's output no longer formats with `{:x}`, and p256 already
# locks base16ct.
base16ct = { version = "1.0.0", features = ["alloc"] }
# The engine's Files and Git watches; the default backend, FSEvents, on macOS.
notify = "8.2.1"
# Terminal emulation (docs/onicode/decisions/terminal.md): aislopware/libghostty-rs, which pins the
# aislopware/ghostty commit whose libghostty-vt it builds. Pinned by rev: the engine's host and the
# app's mirror must run the same snapshot format.
libghostty-vt = { git = "https://github.com/aislopware/libghostty-rs", rev = "42946d984cb6f249ce371f5adf2dd3e4c3d1b603" }
# Markdown parsing only: no HTML writer, no CLI options.
pulldown-cmark = { version = "0.13.6", default-features = false }
unicode-segmentation = "1"
unicode-width = "0.2"
# The updater's HTTP client (onicode-update), HTTP/1.1 only. `rustls-no-provider`: rustls checked by
# the platform verifier (the system's trust store, so a managed Mac's own roots are honored) on ring,
# the provider core's rustls already links, rather than reqwest's default aws-lc-rs, a second
# crypto library; onicode-update installs ring. `stream`: downloads are read as they arrive.
# `system-proxy`: packaged GUI apps do not inherit shell proxy variables, so the macOS system proxy
# is honored.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "system-proxy"] }

[profile.release]
# Distribution profile (scripts/release/bundle-macos.sh): thin LTO buys most of fat
# LTO's size/speed win at a fraction of the link time; strip debug symbols.
lto = "thin"
strip = "symbols"

[profile.dev]
# gpui is slow unoptimized; match zed's approach for deps
opt-level = 0
# Full DWARF was ~90% of every rlib (25 GB of target/debug/deps). Line tables
# keep file:line in panics and backtraces; for locals in lldb, build with
# `--profile dev-debug`.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# `cargo build --profile dev-debug`: dev with full debug info, for lldb.
# Builds into target/dev-debug.
[profile.dev-debug]
inherits = "dev"
debug = true

[profile.dev-debug.package."*"]
debug = true

# Mobile core (scripts/ios/build-core.sh). Always optimized — layout and sync
# run on the phone's hot paths, so even Debug app builds link an -O core.
[profile.mobile]
inherits = "release"
lto = false
strip = false
debug = "line-tables-only"
incremental = true
codegen-units = 16

# TestFlight/App Store archives.
[profile.mobile-dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
# The QUIC stack under onicode-net: n0's noq-proto and noq-udp with slopty's and axolotty's
# patches (vendor/noq-proto/SLOPTY.md, vendor/noq-udp/SLOPTY.md list each).
noq-proto = { path = "vendor/noq-proto" }
noq-udp = { path = "vendor/noq-udp" }
