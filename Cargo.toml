[workspace]
resolver = "2"
members = [
    "crates/voice",
    "crates/voice-media",
    "crates/voice-session",
    "crates/orb",
    "crates/veil",
    "crates/term",
    "crates/term-link",
    "crates/theme",
    "crates/audio",
    "crates/proto",
    "crates/preview",
    "crates/preview-label",
    "crates/doc",
    "crates/sync",
    "crates/harness",
    "crates/engine",
    "crates/rpc",
    "crates/update",
    "crates/cli",
    "crates/launch",
    "crates/ui",
    "crates/notify",
    "crates/syntax",
    "crates/markdown",
    "crates/mobile",
    "crates/mobile-bindgen",
    "crates/client",
    "crates/mcp",
    "crates/text",
    "crates/visual",
    "crates/visual-gpu",
    "crates/zatex",
    "apps/onicode",
    # Peer transport over the tailnet (.research/p2p-transport.md §5.1).
    "crates/net",
    "crates/net-sim",
    "crates/tailnet",
    "crates/peer",
]
# The vendored QUIC crates are workspace roots of their own, reached only through
# [patch.crates-io] below.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
onicode-voice-session = { path = "crates/voice-session" }
onicode-orb = { path = "crates/orb" }
onicode-veil = { path = "crates/veil" }
onicode-term = { path = "crates/term" }
onicode-term-link = { path = "crates/term-link" }
onicode-voice-media = { path = "crates/voice-media" }
onicode-audio = { path = "crates/audio" }
onicode-proto = { path = "crates/proto" }
onicode-preview = { path = "crates/preview" }
onicode-preview-label = { path = "crates/preview-label" }
onicode-doc = { path = "crates/doc" }
onicode-sync = { path = "crates/sync" }
onicode-harness = { path = "crates/harness" }
onicode-engine = { path = "crates/engine" }
onicode-rpc = { path = "crates/rpc" }
onicode-update = { path = "crates/update" }
onicode-cli = { path = "crates/cli" }
onicode-launch = { path = "crates/launch" }
onicode-ui = { path = "crates/ui" }
onicode-notify = { path = "crates/notify" }
onicode-syntax = { path = "crates/syntax" }
onicode-markdown = { path = "crates/markdown" }
onicode-mobile = { path = "crates/mobile" }
onicode-client = { path = "crates/client" }
onicode-theme = { path = "crates/theme" }
onicode-mcp = { path = "crates/mcp" }
onicode-text = { path = "crates/text" }
zatex = { path = "crates/zatex" }
onicode-visual = { path = "crates/visual" }
onicode-visual-gpu = { path = "crates/visual-gpu" }

# Peer transport over the tailnet (.research/p2p-transport.md §5.1).
onicode-net = { path = "crates/net" }
onicode-net-sim = { path = "crates/net-sim" }
onicode-tailnet = { path = "crates/tailnet" }
onicode-peer = { path = "crates/peer" }
# n0's QUIC, held to 1.4.x: noq-proto and noq-udp are the vendored, patched copies
# (vendor/*/SLOPTY.md), and the patches are written against 1.4.0.
noq = { version = "~1.4.0", default-features = false, features = ["runtime-tokio"] }
noq-proto = { version = "1.4.0", default-features = false }
bytes = "1.12"
parking_lot = "0.12.5"
# `all`: binding a socket to the tailnet's interface (`bind_device_by_index_v4`/`_v6`).
socket2 = { version = "0.6.5", features = ["all"] }
# Tailscale's LocalAPI is HTTP/1.1 over a Unix socket or loopback TCP.
hyper = "1.11"
hyper-util = "0.1.20"
http-body-util = "0.1.5"

# CRDT
loro = "1.17"
# Wire protocol for the SessionRoom DO rooms — official Rust twin of the npm
# `loro-protocol` package the TS edge speaks (same monorepo, byte-identical
# frames, cross-checked by its js_snapshots tests).
loro-protocol = "0.3"

# gpui — zeronsh/zui, extracted from wingleeio/zed e2ddcc6 with identical
# crate sources; adds bounded blur passes and shared Gaussian weights.
# Removes GPL tracing crates and composites deferred GPUI content above native macOS views.
# Preserved fork history: upstream f14fea9 + commits on
# `comet/edge-fade-horizontal` (tip of `comet/line-wrap-closing-punctuation`
# + 5d1f83d horizontal per-pixel EdgeFade for quads/images; rebase when bumping the
# upstream rev): a6bf17c fixes BOTH wrap-rule copies (LineWrapper +
# line_layout's shaped-text duplicate); 14baea0 adds the EdgeFade primitive
# (Window::with_edge_fade — per-primitive scroll-edge fades for the glass
# sidebar); a6c1ad5 adds BackdropBlur + horizontal EdgeFade + glass fixes;
# 9b672fa bounds renderer GPU memory (region-sized backdrop blur scratch,
# idle release of blur/path intermediates, instance pool shrink,
# ONICODE_GPU_STATS=1 diagnostics); b687328 adds ImageSource::evict (frees
# sprite-atlas tiles — remove_asset alone leaked them, see
# attachments::flush_evicted); ac135eb adds device memory to the stats line;
# f596cde fixes destination alpha on transparent windows (Porter-Duff OVER,
# not additive); 53518c0 merges the edge-fade line: per-edge fade bands +
# per-pixel EdgeFade for quads/images (true fade-into-glass), and
# object-fit Cover cropping via atlas-tile UVs so image corner radii hold;
# 8a8954c switches the macOS blurred view to UnderWindowBackground (macOS 26
# stopped vending CABackdropLayer for Selection — window blur went dead);
# b68970e rasterizes BackdropBlur in the wgpu renderer (frosted floats on
# Linux — the Metal path's snapshot/blur/composite, ported).
# Paint-time rounded image masks (#9), bounded Windows backdrop blur and
# translucent compositing, plus blur-aware scene batching (#10).
# Per-pixel rounded clipping (`Window::with_rounded_clip`, 361ff20).
# Drags need the button held and 4px of travel (0dc69aa).
# Atlas tiles updated in place from pixels or imported dma-bufs, display-rate
# frame callbacks in inactive windows, and Wayland frames that no longer stop
# after a forced draw (b564a34, zeronsh/zui#18).
gpui = { git = "https://github.com/zeronsh/zui", rev = "b564a34413bb7ef1da04121c4a287758f94993d9" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "b564a34413bb7ef1da04121c4a287758f94993d9", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
gpui_tokio = { git = "https://github.com/zeronsh/zui", rev = "b564a34413bb7ef1da04121c4a287758f94993d9" }
gpui-base = { git = "https://github.com/zeronsh/gpui-component", rev = "59f89243cea79dd70eb7a619b3930c374ef6958a" }

# diffs
similar = "2"

# async / net
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
libc = "0.2"
gethostname = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
# antigravity writes `settings.json` but reads it back with `hjson.load`, so a
# user's comments and unquoted keys have to survive our read of the same file.
deser-hjson = "2.2"
plist = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# misc
# Global allocator on macOS only: libmalloc retains the churn high-water mark
# as permanent RSS - measured as the top residency cause in
# docs/memory-plan.md. Pinned to mimalloc v2: the crate's default (v3.3.2)
# has the same watermark pathology itself - transient streaming/render churn
# became permanent RSS (~6x glibc growth, daemon at 908MB for 7.3MB of docs,
# no idle recovery). Linux stays on glibc, which measured flat on the same
# workloads.
mimalloc = { version = "0.1", features = ["v2"] }
anyhow = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
zip = { version = "9.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
notify = "7"
portable-pty = "0.9"
alacritty_terminal = "0.26"
pulldown-cmark = "0.12"
unicode-segmentation = "1"
unicode-width = "0.2"
fontdb = "0.23"
ttf-parser = "0.25.1"
# Packaged GUI apps do not inherit shell proxy variables; honor the macOS
# system proxy for provider usage probes and other HTTP clients.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "system-proxy"] }
ignore = "0.4"
# Workspace file/content search index (@ mentions, file tree, cmd+K).
# Pinned exactly: crates.io also carries `0.11.1-nightly.*` prereleases.
fff-search = "=0.11.0"

[profile.release]
# Distribution profile (scripts/package-linux.sh): thin LTO buys most of fat
# LTO's size/speed win at a fraction of the link time; strip debug symbols.
lto = "thin"
strip = "symbols"

[profile.dev]
# gpui is slow unoptimized; match zed's approach for deps
opt-level = 0
# Full DWARF was ~90% of every rlib (25 GB of target/debug/deps). Line tables
# keep file:line in panics and backtraces; for locals in lldb, build with
# `--profile dev-debug`.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# `cargo build --profile dev-debug`: dev with full debug info, for lldb.
# Builds into target/dev-debug.
[profile.dev-debug]
inherits = "dev"
debug = true

[profile.dev-debug.package."*"]
debug = true

# Scenes rasterize in software every frame the camera moves.
[profile.dev.package.onicode-visual]
opt-level = 3

[profile.dev.package.onicode-visual-gpu]
opt-level = 3

# Mobile core (scripts/ios/build-core.sh). Always optimized — layout and sync
# run on the phone's hot paths, so even Debug app builds link an -O core.
[profile.mobile]
inherits = "release"
lto = false
strip = false
debug = "line-tables-only"
incremental = true
codegen-units = 16

# TestFlight/App Store archives.
[profile.mobile-dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# askama 0.16.1 diffs canonical template paths against a non-canonical caller directory, so
# uniffi_bindgen fails to build under a symlinked ~/.cargo/registry. aislopware/askama main
# carries the fix (scripts/upstream/sources.toml); drop this once upstream has it.
[patch.crates-io]
askama = { git = "https://github.com/aislopware/askama", rev = "bc3733ad153cd3e7e7c02d93c025c4efe21c93f9" }
askama_derive = { git = "https://github.com/aislopware/askama", rev = "bc3733ad153cd3e7e7c02d93c025c4efe21c93f9" }
askama_macros = { git = "https://github.com/aislopware/askama", rev = "bc3733ad153cd3e7e7c02d93c025c4efe21c93f9" }
askama_parser = { git = "https://github.com/aislopware/askama", rev = "bc3733ad153cd3e7e7c02d93c025c4efe21c93f9" }

# The QUIC stack under onicode-net: n0's noq-proto and noq-udp with slopty's and axolotty's
# patches (vendor/noq-proto/SLOPTY.md, vendor/noq-udp/SLOPTY.md list each).
noq-proto = { path = "vendor/noq-proto" }
noq-udp = { path = "vendor/noq-udp" }
