[workspace]
resolver = "2"
members = [
    "crates/voice",
    "crates/voice-media",
    "crates/voice-session",
    "crates/orb",
    "crates/veil",
    "crates/term",
    "crates/term-link",
    "crates/theme",
    "crates/audio",
    "crates/proto",
    "crates/preview",
    "crates/preview-label",
    "crates/doc",
    "crates/sync",
    "crates/harness",
    "crates/engine",
    "crates/rpc",
    "crates/update",
    "crates/cli",
    "crates/launch",
    "crates/ui",
    "crates/notify",
    "crates/syntax",
    "crates/markdown",
    "crates/mobile",
    "crates/mobile-bindgen",
    "crates/client",
    "crates/mcp",
    "crates/text",
    "crates/visual",
    "crates/visual-gpu",
    "crates/zatex",
    "apps/onicode",
    # Peer transport over the tailnet (.research/p2p-transport.md §5.1).
    "crates/net",
    "crates/net-sim",
    "crates/tailnet",
    "crates/peer",
    # Remote desktop (.research/remote-desktop.md §5).
    "crates/desktop-media",
]
# The vendored QUIC crates are workspace roots of their own, reached only through
# [patch.crates-io] below.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# gpui-fast's renderer pins wgpu by rev; onicode's shader checks and offscreen visuals take the same one.
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007" }
naga = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007" }
onicode-voice-session = { path = "crates/voice-session" }
onicode-orb = { path = "crates/orb" }
onicode-veil = { path = "crates/veil" }
onicode-term = { path = "crates/term" }
onicode-term-link = { path = "crates/term-link" }
onicode-voice-media = { path = "crates/voice-media" }
onicode-proto = { path = "crates/proto" }
onicode-preview = { path = "crates/preview" }
onicode-preview-label = { path = "crates/preview-label" }
onicode-doc = { path = "crates/doc" }
onicode-sync = { path = "crates/sync" }
onicode-harness = { path = "crates/harness" }
onicode-engine = { path = "crates/engine" }
onicode-rpc = { path = "crates/rpc" }
onicode-update = { path = "crates/update" }
onicode-cli = { path = "crates/cli" }
onicode-launch = { path = "crates/launch" }
onicode-ui = { path = "crates/ui" }
onicode-notify = { path = "crates/notify" }
onicode-syntax = { path = "crates/syntax" }
onicode-markdown = { path = "crates/markdown" }
onicode-client = { path = "crates/client" }
onicode-theme = { path = "crates/theme" }
onicode-mcp = { path = "crates/mcp" }
onicode-text = { path = "crates/text" }
zatex = { path = "crates/zatex" }
onicode-visual = { path = "crates/visual" }
onicode-visual-gpu = { path = "crates/visual-gpu" }

# Peer transport over the tailnet (.research/p2p-transport.md §5.1).
onicode-net = { path = "crates/net" }
onicode-net-sim = { path = "crates/net-sim" }
onicode-peer = { path = "crates/peer" }
onicode-tailnet = { path = "crates/tailnet" }
# Systematic Reed–Solomon parity for video frames (NEON on Apple silicon).
reed-solomon-simd = "3.1.0"
# Fixed little-endian wire layouts read in place. 0.9 is an alpha with a new API and no measured
# gain here.
zerocopy = { version = "0.8.63", features = ["derive"] }
# n0's QUIC, held to 1.4.x: noq-proto and noq-udp are the vendored, patched copies
# (vendor/*/SLOPTY.md), and the patches are written against 1.4.0.
noq = { version = "~1.4.0", default-features = false, features = ["runtime-tokio"] }
noq-proto = { version = "1.4.0", default-features = false }
bytes = "1.12"
parking_lot = "0.12.5"
# `all`: binding a socket to the tailnet's interface (`bind_device_by_index_v4`/`_v6`).
socket2 = { version = "0.6.5", features = ["all"] }
# Tailscale's LocalAPI is HTTP/1.1 over a Unix socket or loopback TCP.
hyper = "1.11"
hyper-util = "0.1.20"
http-body-util = "0.1.5"

# CRDT
loro = "1.17"
# Block compression for doc-sync frames; the version loro already brings in.
lz4_flex = "0.11.6"
# Property and model tests; the version noq-proto's tests already lock.
proptest = "1.12"
pretty_assertions = "1.4.1"
# Structured fuzz inputs; desktop-media's tests replay its fuzz corpora through them.
arbitrary = { version = "1.5.0", features = ["derive"] }

# GPUI is aislopware/gpui-fast (retained mode, docs/onicode/decisions/rendering.md), pinned by rev on
# its main; the gpui-pre crates it reaches are patched to the same rev below, so the graph holds
# exactly one GPUI. Components are aislopware/gpui-kit's base crate on its main (upstream
# longbridge/gpui-kit plus the caret and gutter fixes).
gpui = { git = "https://github.com/aislopware/gpui-fast.git", rev = "bd0a6317936e6f4c8f010cee2a185fdec77de185" }
gpui_platform = { git = "https://github.com/aislopware/gpui-fast.git", rev = "bd0a6317936e6f4c8f010cee2a185fdec77de185", features = [
    "font-kit",
    "runtime_shaders",
] }
gpui_tokio = { git = "https://github.com/aislopware/gpui-fast.git", rev = "bd0a6317936e6f4c8f010cee2a185fdec77de185" }
# Tests build a text system and executor without a platform, which only the main thread may create.
gpui_apple = { git = "https://github.com/aislopware/gpui-fast.git", rev = "bd0a6317936e6f4c8f010cee2a185fdec77de185", features = [
    "font-kit",
] }
gpui-base = { git = "https://github.com/aislopware/gpui-kit.git", rev = "a15e2658c44497a4b4861baac66e30d59de297df" }

# diffs
similar = "2"

# async / net
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
libc = "0.2"
gethostname = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
# antigravity writes `settings.json` but reads it back with `hjson.load`, so a
# user's comments and unquoted keys have to survive our read of the same file.
deser-hjson = "2.2"
plist = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# misc
# Global allocator on macOS only: libmalloc retains the churn high-water mark
# as permanent RSS - measured as the top residency cause in
# docs/memory-plan.md. Pinned to mimalloc v2: the crate's default (v3.3.2)
# has the same watermark pathology itself - transient streaming/render churn
# became permanent RSS (~6x glibc growth, daemon at 908MB for 7.3MB of docs,
# no idle recovery). Linux stays on glibc, which measured flat on the same
# workloads.
mimalloc = { version = "0.1", features = ["v2"] }
anyhow = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
zip = { version = "9.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
notify = "7"
portable-pty = "0.9"
alacritty_terminal = "0.26"
pulldown-cmark = "0.12"
unicode-segmentation = "1"
unicode-width = "0.2"
ttf-parser = "0.25.1"
# Packaged GUI apps do not inherit shell proxy variables; honor the macOS
# system proxy for provider usage probes and other HTTP clients.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "system-proxy"] }
ignore = "0.4"
# Workspace file/content search index (@ mentions, file tree, cmd+K).
# Pinned exactly: crates.io also carries `0.11.1-nightly.*` prereleases.
fff-search = "=0.11.0"

[profile.release]
# Distribution profile (scripts/package-linux.sh): thin LTO buys most of fat
# LTO's size/speed win at a fraction of the link time; strip debug symbols.
lto = "thin"
strip = "symbols"

[profile.dev]
# gpui is slow unoptimized; match zed's approach for deps
opt-level = 0
# Full DWARF was ~90% of every rlib (25 GB of target/debug/deps). Line tables
# keep file:line in panics and backtraces; for locals in lldb, build with
# `--profile dev-debug`.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# `cargo build --profile dev-debug`: dev with full debug info, for lldb.
# Builds into target/dev-debug.
[profile.dev-debug]
inherits = "dev"
debug = true

[profile.dev-debug.package."*"]
debug = true

# Scenes rasterize in software every frame the camera moves.
[profile.dev.package.onicode-visual]
opt-level = 3

[profile.dev.package.onicode-visual-gpu]
opt-level = 3

# Mobile core (scripts/ios/build-core.sh). Always optimized — layout and sync
# run on the phone's hot paths, so even Debug app builds link an -O core.
[profile.mobile]
inherits = "release"
lto = false
strip = false
debug = "line-tables-only"
incremental = true
codegen-units = 16

# TestFlight/App Store archives.
[profile.mobile-dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# askama 0.16.1 diffs canonical template paths against a non-canonical caller directory, so
# uniffi_bindgen fails to build under a symlinked ~/.cargo/registry. aislopware/askama main
# carries the fix (scripts/upstream/sources.toml); drop this once upstream has it.
[patch.crates-io]
askama = { git = "https://github.com/aislopware/askama", rev = "bc3733ad153cd3e7e7c02d93c025c4efe21c93f9" }
askama_derive = { git = "https://github.com/aislopware/askama", rev = "bc3733ad153cd3e7e7c02d93c025c4efe21c93f9" }
askama_macros = { git = "https://github.com/aislopware/askama", rev = "bc3733ad153cd3e7e7c02d93c025c4efe21c93f9" }
askama_parser = { git = "https://github.com/aislopware/askama", rev = "bc3733ad153cd3e7e7c02d93c025c4efe21c93f9" }

# gpui-kit names GPUI by the gpui-pre snapshots; the gpui-fast fork's compat crates stand in for the ones
# the graph reaches, at this one rev.
gpui-pre = { git = "https://github.com/aislopware/gpui-fast.git", rev = "bd0a6317936e6f4c8f010cee2a185fdec77de185" }
gpui-pre-macros = { git = "https://github.com/aislopware/gpui-fast.git", rev = "bd0a6317936e6f4c8f010cee2a185fdec77de185" }
gpui-pre-sum-tree = { git = "https://github.com/aislopware/gpui-fast.git", rev = "bd0a6317936e6f4c8f010cee2a185fdec77de185" }

# The QUIC stack under onicode-net: n0's noq-proto and noq-udp with slopty's and axolotty's
# patches (vendor/noq-proto/SLOPTY.md, vendor/noq-udp/SLOPTY.md list each).
noq-proto = { path = "vendor/noq-proto" }
noq-udp = { path = "vendor/noq-udp" }
