# Git hooks (scripts/dev/setup.sh installs them). pre-commit checks only the staged files, every checker at
# once, in about two seconds; pre-push runs fmt and clippy. CI runs the same checkers over the whole tree.

pre-commit:
  parallel: true
  jobs:
    - name: rustfmt
      glob: '*.rs'
      exclude: ['vendor/**']
      run: . scripts/dev/tools.env && rustfmt "+$RUST_NIGHTLY" --check --edition 2024 --config skip_children=true {staged_files}

    - name: typos
      run: typos --force-exclude {staged_files}

    - name: taplo
      glob: '*.toml'
      exclude: ['vendor/**']
      run: RUST_LOG=warn taplo fmt --check {staged_files}

    - name: shellcheck
      glob: ['*.sh', 'scripts/dev/tools.env']
      exclude: ['vendor/**']
      run: shellcheck {staged_files}

    - name: shfmt
      glob: '*.sh'
      exclude: ['vendor/**']
      run: shfmt -d {staged_files}

    - name: ruff
      glob: '*.py'
      run: ruff format --check --quiet --force-exclude {staged_files} && ruff check --quiet --force-exclude {staged_files}

    - name: swiftlint
      glob: '*.swift'
      run: swiftlint lint --strict --quiet --force-exclude --baseline apps/ios/.swiftlint-baseline.json {staged_files}

    - name: swift-format
      glob: '*.swift'
      run: swift format lint --strict {staged_files}

    - name: actionlint
      glob: '.github/workflows/*.yml'
      run: actionlint {staged_files}

    - name: zizmor
      glob: '.github/**/*.yml'
      run: zizmor --persona auditor --quiet --offline .github

pre-push:
  jobs:
    - name: fmt and clippy
      run: scripts/dev/check.sh lint
