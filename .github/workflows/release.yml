name: Release

# Builds the desktop app at apps/desktop's version through better-update. With notes, it then
# releases the builds to the `latest` feeds and publishes the GitHub release v<version> with the
# notes. The feeds are the only place the app is downloaded from.
# See docs/operations/release.md; scripts/release/publish.sh is the same release from a Mac.
#
#   gh workflow run release.yml --ref main -f notes="$(cat notes.md)"
#   gh workflow run release.yml --ref main -f mobile=both -f desktop=false
#
# Mobile ships each chosen platform as a store build when its native fingerprint has no production
# build yet, and otherwise as an OTA update to the builds that share it.
#
# iOS builds on the self-hosted runner labelled onicode-ios (a macOS VM that keeps its ccache, pnpm
# store and CocoaPods cache between runs); -f ios_runner=github falls back to a hosted macOS runner.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes in Markdown. Leave empty to build without releasing.
        type: string
        default: ""
      mobile:
        description: Mobile platforms to ship. A native change makes a store build (iOS goes to TestFlight, Android to Google Play internal testing); a JS-only change publishes an OTA update.
        type: choice
        options: [none, both, ios, android]
        default: none
      mobile_store_build:
        description: Make the store build even when the native fingerprint already has one.
        type: boolean
        default: false
      desktop:
        description: Build macOS and Linux. Releasing needs them.
        type: boolean
        default: true
      ios_runner:
        description: Where the iOS store build runs.
        type: choice
        options: [self-hosted, github]
        default: self-hosted

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  BETTER_UPDATE_URL: https://updates.jmango360.dev
  BETTER_UPDATE_ROBOT: ${{ secrets.BETTER_UPDATE_ROBOT }}
  BETTER_UPDATE_DISABLE_UPDATE_NOTIFIER: "1"

jobs:
  macos:
    name: Build macOS
    if: github.ref == 'refs/heads/main' && inputs.desktop
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # The desktop build needs every workspace package but the mobile app, whose React Native
      # dependencies and postinstalls cost a minute.
      BETTER_UPDATE_INSTALL_FILTER: "!@onicode/mobile"
    outputs:
      build: ${{ steps.build.outputs.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/setup-release
      - uses: ./.github/actions/pnpm-store-cache
        with:
          key: desktop

      - name: Build
        id: build
        run: |
          ids="$(scripts/release/build.sh macos "$ONICODE_RELEASE_MESSAGE")"
          echo "build=${ids%%$'\n'*}" >> "$GITHUB_OUTPUT"

      - name: Check the zip as the native Onicode's updater does
        env:
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          zip="$RUNNER_TEMP/Onicode.zip"
          better-update builds download "$BUILD" --output "$zip"
          scripts/release/verify-macos-zip.sh "$zip" "$ONICODE_VERSION"

  linux:
    name: Build Linux
    if: github.ref == 'refs/heads/main' && inputs.desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # build-linux.sh installs inside its container; the staged copy's host install goes unused.
      BETTER_UPDATE_INSTALL_SCOPE: none
    outputs:
      builds: ${{ steps.build.outputs.builds }}
    steps:
      # The staged copy and the container build each hold a full checkout, and the image is large.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-release

      - name: Build
        id: build
        run: |
          ids="$(scripts/release/build.sh linux "$ONICODE_RELEASE_MESSAGE")"
          echo "builds=${ids//$'\n'/ }" >> "$GITHUB_OUTPUT"

  mobile:
    name: Ship ${{ matrix.platform }}
    if: github.ref == 'refs/heads/main' && inputs.mobile != 'none'
    runs-on: ${{ matrix.platform == 'android' && 'ubuntu-24.04' || inputs.ios_runner == 'github' && 'macos-26' || fromJSON('["self-hosted", "macOS", "ARM64", "onicode-ios"]') }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ inputs.mobile == 'both' && fromJSON('["ios", "android"]') || fromJSON(format('["{0}"]', inputs.mobile)) }}
    env:
      # Skip expo-doctor's advisory checks, and install only the app's workspace closure in the
      # staged copy rather than every desktop package.
      BETTER_UPDATE_BUILD_DISABLE_EXPO_DOCTOR_STEP: "1"
      BETTER_UPDATE_INSTALL_SCOPE: app
      # ccache checks compilers by content because the NDK installs fresh on every runner.
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
      # Gradle's native builds (CMake) pick these up; iOS uses ccache through ios.ccacheEnabled.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # The push gateway these builds register with. A gateway serves only the builds signed for
      # it, so ours is a secret rather than a default in the repository.
      ONICODE_PUSH_GATEWAY_URL: ${{ secrets.ONICODE_PUSH_GATEWAY_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # BETTER_UPDATE_BUILD_DIR keeps better-update's staging copy and DerivedData at the same paths
      # every run, so compiler arguments repeat and ccache hits. React Native's iOS ccache wrapper
      # swaps in its own config file, so the cache directory and size go in the environment. It
      # also execs $CCACHE_BINARY, a build setting Xcode never exports to the compiler, so without
      # it here clang runs uncached. Hosted runners save the directory with ccache-action; the
      # self-hosted runner keeps its own outside the cleaned workspace.
      - name: Pin the staging base and ccache
        run: |
          {
            echo "TMPDIR=$RUNNER_TEMP"
            echo "BETTER_UPDATE_BUILD_DIR=$RUNNER_TEMP/bu-build"
            echo "CCACHE_BASEDIR=$RUNNER_TEMP"
            echo "CCACHE_BINARY=ccache"
          } >> "$GITHUB_ENV"
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]; then
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
            echo "CCACHE_MAXSIZE=5G" >> "$GITHUB_ENV"
          else
            echo "CCACHE_DIR=$HOME/Library/Caches/onicode-ccache" >> "$GITHUB_ENV"
            echo "CCACHE_MAXSIZE=30G" >> "$GITHUB_ENV"
          fi
      - uses: ./.github/actions/setup-release
      # better-update fingerprints the native project with bunx @expo/fingerprint.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: runner.environment == 'github-hosted'
        uses: ./.github/actions/pnpm-store-cache
        with:
          key: mobile
      # better-update loads the Expo config and its plugins from here before it stages the build.
      - name: Install the mobile workspace
        run: pnpm install --frozen-lockfile --prefer-offline --filter "@onicode/mobile..."

      # The Firebase client file is part of the Android fingerprint, so it is in place before the
      # plan and stays for the build or update that follows. It is kept out of the checkout.
      - name: Supply the push settings
        env:
          PLATFORM: ${{ matrix.platform }}
          GOOGLE_SERVICES_JSON: ${{ matrix.platform == 'android' && secrets.ONICODE_ANDROID_GOOGLE_SERVICES_JSON || '' }}
        run: |
          if [[ -z "$ONICODE_PUSH_GATEWAY_URL" ]]; then
            echo "::warning::ONICODE_PUSH_GATEWAY_URL is not set, so this $PLATFORM release has push notifications off."
          fi
          [[ "$PLATFORM" == android ]] || exit 0
          if [[ -z "$GOOGLE_SERVICES_JSON" ]]; then
            echo "::warning::ONICODE_ANDROID_GOOGLE_SERVICES_JSON is not set, so this Android release cannot receive pushes."
            exit 0
          fi
          file="$RUNNER_TEMP/google-services.json"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$file"
          jq -e '.client | arrays | length > 0' "$file" > /dev/null || { echo "::error::ONICODE_ANDROID_GOOGLE_SERVICES_JSON is not a google-services.json."; exit 1; }
          echo "ONICODE_ANDROID_GOOGLE_SERVICES_FILE=$file" >> "$GITHUB_ENV"

      # The production runtime version is the native fingerprint, so a production build with this
      # one can take the JS as an update. This runs on the build's own runner, from the checkout
      # better-update fingerprints for the build it records and the update it publishes.
      - name: Choose a store build or an OTA update
        id: plan
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
          PLATFORM: ${{ matrix.platform }}
          FORCE: ${{ inputs.mobile_store_build }}
        run: |
          # Fails rather than counting zero when better-update answers with an error.
          builds() {
            local out
            out="$(better-update builds list --platform "$PLATFORM" --profile production "$@" --json)" || true
            jq -e '.data.items | arrays' <<< "$out" || { echo "::error::better-update builds list failed: $out" >&2; return 1; }
          }
          fingerprint="$(better-update fingerprint generate --platform "$PLATFORM" --json)" || { echo "$fingerprint"; exit 1; }
          runtime="$(jq -er .data.hash <<< "$fingerprint")"
          # Expo drops fingerprint.config.js without a word when it fails to load, and the default
          # it falls back to does not see patched native modules.
          if ! jq -e '.data.sources | any(.id == "appMajorVersion")' > /dev/null <<< "$fingerprint"; then
            echo "::error::The fingerprint was computed without apps/mobile/fingerprint.config.js."
            exit 1
          fi
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          matching="$(builds --runtime-version "$runtime" --limit 1)"
          if [[ "$FORCE" != true && "$(jq length <<< "$matching")" -gt 0 ]]; then
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "$PLATFORM runtime \`$runtime\` has a store build, so this publishes an OTA update." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Store build numbers follow the version, so a second build of one version cannot ship.
          recent="$(builds --limit 100)"
          if jq -e --arg v "$ONICODE_VERSION" 'any(.[]; .Version == $v)' > /dev/null <<< "$recent"; then
            echo "::error::$PLATFORM needs a store build for runtime $runtime, but $ONICODE_VERSION already has one. Bump the version first."
            exit 1
          fi
          echo "native=true" >> "$GITHUB_OUTPUT"
          echo "$PLATFORM runtime \`$runtime\` has no store build, so this builds $ONICODE_VERSION." >> "$GITHUB_STEP_SUMMARY"

      # An update under any other runtime version than the planned one reaches no build.
      - name: Publish the OTA update
        if: steps.plan.outputs.native == 'false'
        working-directory: apps/mobile
        env:
          PLATFORM: ${{ matrix.platform }}
          RUNTIME: ${{ steps.plan.outputs.runtime }}
        run: |
          published="$(better-update update publish --channel production --profile production \
            --platform "$PLATFORM" --message "$ONICODE_RELEASE_MESSAGE" --non-interactive --json)" || { echo "$published"; exit 1; }
          jq . <<< "$published"
          if ! jq -e --arg r "$RUNTIME" '.data.results | length > 0 and all(.runtimeVersion == $r)' > /dev/null <<< "$published"; then
            echo "::error::The update was not published for the planned runtime $RUNTIME."
            exit 1
          fi

      - if: steps.plan.outputs.native == 'true' && runner.environment == 'github-hosted'
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: mobile-${{ matrix.platform }}
          max-size: 5G

      - name: Cache Gradle
        if: steps.plan.outputs.native == 'true' && matrix.platform == 'android'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-mobile-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts', 'apps/mobile/plugins/**') }}
          restore-keys: gradle-mobile-
      # The user gradle.properties outranks the generated project's, and better-update adds no flags.
      - name: Turn on the Gradle build cache
        if: steps.plan.outputs.native == 'true' && matrix.platform == 'android'
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' org.gradle.caching=true org.gradle.parallel=true >> ~/.gradle/gradle.properties

      - name: Cache CocoaPods
        if: steps.plan.outputs.native == 'true' && matrix.platform == 'ios' && runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: cocoapods-

      # expo-updates would otherwise fingerprint again in the middle of the native build, where
      # files a module generates into its own directory can change the hash. Like EAS Build, this
      # embeds the planned one, and then checks that better-update recorded the build under it.
      - name: Build
        id: build
        if: steps.plan.outputs.native == 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
          EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ steps.plan.outputs.runtime }}
        run: |
          ids="$(scripts/release/build.sh "$PLATFORM" "$ONICODE_RELEASE_MESSAGE")"
          build="${ids%%$'\n'*}"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          recorded="$(better-update builds list --platform "$PLATFORM" --profile production \
            --runtime-version "$EXPO_UPDATES_FINGERPRINT_OVERRIDE" --limit 20 --json)" || true
          if ! jq -e --arg id "$build" '.data.items | arrays | any(.ID == $id)' > /dev/null <<< "$recorded"; then
            echo "::error::Build $build embeds runtime $EXPO_UPDATES_FINGERPRINT_OVERRIDE but better-update recorded another, so updates would miss it."
            exit 1
          fi
      # Apple caps What to Test at 4000 bytes; better-update checks that before the upload.
      - name: Send to TestFlight
        if: steps.plan.outputs.native == 'true' && matrix.platform == 'ios'
        working-directory: apps/mobile
        env:
          BUILD: ${{ steps.build.outputs.build }}
          NOTES: ${{ inputs.notes }}
        run: |
          what="${NOTES:-$ONICODE_RELEASE_MESSAGE}"
          better-update submit --platform ios --id "$BUILD" --what-to-test "${what:0:3000}" --non-interactive
      # The submit profile's service account can release to Play's testing tracks and nothing else.
      - name: Send to Google Play internal testing
        if: steps.plan.outputs.native == 'true' && matrix.platform == 'android'
        working-directory: apps/mobile
        env:
          BUILD: ${{ steps.build.outputs.build }}
        run: better-update submit --platform android --id "$BUILD" --non-interactive
      - name: ccache stats
        if: always() && steps.plan.outputs.native == 'true'
        run: ccache --show-stats

  # Tags at dispatch, while this is main's head: GitHub refuses GITHUB_TOKEN a new tag on a commit
  # whose workflows differ from main's, so tagging after an hour of builds fails if main moved.
  tag:
    name: Tag
    if: github.ref == 'refs/heads/main' && inputs.notes != '' && inputs.desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Tag v<version>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p 'require("./apps/desktop/package.json").version')"
          tagged="$(git ls-remote origin "refs/tags/$tag" | cut -f1)"
          if [[ -z "$tagged" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          elif [[ "$tagged" != "$GITHUB_SHA" ]]; then
            echo "::error::$tag already tags $tagged. Bump the version first."
            exit 1
          fi

  release:
    name: Release to latest
    needs: [tag, macos, linux]
    if: github.ref == 'refs/heads/main' && inputs.notes != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-release

      - name: Release
        env:
          NOTES: ${{ inputs.notes }}
          MAC_BUILD: ${{ needs.macos.outputs.build }}
          LINUX_BUILDS: ${{ needs.linux.outputs.builds }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          better-update macos release create "$MAC_BUILD" --channel latest --notes-file "$RUNNER_TEMP/notes.md"
          read -ra linux_builds <<< "$LINUX_BUILDS"
          better-update linux release create "${linux_builds[@]}" --channel latest --notes-file "$RUNNER_TEMP/notes.md"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/github-release.sh "$ONICODE_VERSION" "$RUNNER_TEMP/notes.md"
