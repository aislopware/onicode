name: Scenarios

# The end-to-end suites of scripts/scenarios: the dev Electron app under xvfb, and the iOS app on
# a simulator. They run when a scenario, the harness, or what the harness starts the app through
# changes, and by hand. They stay out of the `Check` gate: neither has a long enough record to
# block every pull request on it.
# The run on main is what later pull requests restore the iOS dev client from.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/scenarios/**
      - scripts/e2e.config.ts
      - scripts/prove-scenario.ts
      - scripts/package.json
      - scripts/dev-runner.ts
      - scripts/mobile-native-client.ts
      - apps/desktop/scripts/dev-electron.mjs
      - apps/desktop/src/app/DesktopEnvironment.ts
      - apps/server/src/environment/ServerEnvironmentLabel.ts
      - .github/workflows/scenarios.yml
  pull_request:
    paths:
      - scripts/scenarios/**
      - scripts/e2e.config.ts
      - scripts/prove-scenario.ts
      - scripts/package.json
      - scripts/dev-runner.ts
      - scripts/mobile-native-client.ts
      - apps/desktop/scripts/dev-electron.mjs
      - apps/desktop/src/app/DesktopEnvironment.ts
      - apps/server/src/environment/ServerEnvironmentLabel.ts
      - .github/workflows/scenarios.yml

permissions:
  contents: read

concurrency:
  group: scenarios-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # One stack serves a run's scenarios one after another, so the suite is split across runners
  # instead: each shard starts its own app.
  desktop:
    name: Desktop scenarios ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The dev runner stops itself above half of RAM to protect a developer's machine from a
      # leak. Here that is 7.8 GiB, which a healthy run crosses; the job timeout bounds this one.
      ONICODE_DEV_MEMORY_LIMIT_GB: "0"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/oni-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Start installing the desktop build libraries and xvfb
        uses: ./.github/actions/apt-install-start
        with:
          packages: libsecret-1-dev pkg-config tmux xvfb

      # CI's Lint job saves the same store for this commit.
      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          save-pnpm-store: "false"

      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @onicode/desktop ensure:electron

      - name: Finish installing the desktop build libraries and xvfb
        timeout-minutes: 10
        uses: ./.github/actions/apt-install-finish

      # The dev runner builds the resource monitor when the binary is missing, which takes
      # 25 to 60 seconds of every start. The key is the crate's whole source, so a restored
      # binary is the one this checkout would build.
      - name: Cache the resource monitor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/release/oni-resource-monitor
          key: resource-monitor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/resource-monitor/Cargo.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/src/**') }}

      # e2e records each scenario's video with Playwright's ffmpeg. It attaches to the app's own
      # window, so it needs no browser.
      - name: Install the video encoder
        working-directory: scripts
        run: node "$(realpath node_modules/@e2e-dev/web)/../../playwright-core/cli.js" install ffmpeg

      # Ubuntu 24.04 denies unprivileged user namespaces, which Chromium's sandbox needs.
      - name: Allow Electron's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run the desktop scenarios
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" vp run scenarios --target desktop --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Print the summary
        if: ${{ !cancelled() }}
        run: cat scripts/.e2e/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload traces and captures
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenarios-desktop-${{ matrix.shard }}
          # `.e2e` is a hidden directory, which the action leaves out unless told.
          include-hidden-files: true
          path: |
            scripts/.e2e
            !scripts/.e2e/**/*.zip
          retention-days: 7

  ios:
    name: iOS scenarios
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # The shared client cache needs a login this job does not have; actions/cache stands in.
      ONICODE_NATIVE_CLIENT_CACHE: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # No pnpm store here: restoring its 1.3 GB takes 75 to 90 seconds on a hosted macOS
      # runner and saving it two minutes, against a minute to install from the registry.
      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          pnpm-store: "false"

      # The newest saved client. One built for another native fingerprint is ignored below, and
      # the build that replaces it is saved under its own.
      - name: Restore the dev client
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/onicode/native-clients/artifacts/ios
          key: ios-dev-client-none
          restore-keys: ios-dev-client-

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: cocoapods-

      - name: Fetch or build the dev client
        id: client
        run: |
          prepared="$(node scripts/mobile-native-client.ts ensure ios --prepare | tail -n 1)"
          echo "$prepared"
          echo "source=$(jq -er .source <<< "$prepared")" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(jq -er .fingerprint <<< "$prepared")" >> "$GITHUB_OUTPUT"

      - name: Save the dev client
        if: steps.client.outputs.source == 'build'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/onicode/native-clients/artifacts/ios
          key: ios-dev-client-${{ steps.client.outputs.fingerprint }}

      # A device of its own: the image's simulators repeat names across runtimes. A hosted runner
      # has 7 GB, less than a stock iOS simulator takes, so it boots without the background
      # services a scenario never touches.
      - name: Create a slim simulator
        run: |
          # The newest iOS runtime and the first iPhone it supports: not every device type boots on
          # every runtime.
          read -r runtime type < <(xcrun simctl list runtimes available -j | jq -er '
            [.runtimes[] | select(.platform == "iOS")]
            | max_by(.version | split(".") | map(tonumber))
            | "\(.identifier) \(first(.supportedDeviceTypes[] | select(.productFamily == "iPhone")).identifier)"')
          udid="$(xcrun simctl create "Scenario iPhone" "$type" "$runtime")"
          brew install mobai-app/tap/simslim
          simslim on "$udid" --except store,web --preserve-boot-state
          echo "E2E_IOS_DEVICE=Scenario iPhone" >> "$GITHUB_ENV"

      # The dev runner builds the resource monitor when the binary is missing, and
      # the server waits for it. The key is the crate's whole source, so a restored
      # binary is the one this checkout would build.
      - name: Cache the resource monitor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/release/oni-resource-monitor
          key: resource-monitor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/resource-monitor/Cargo.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/src/**') }}

      # Without it Metro transforms every module again, which takes four minutes here.
      - name: Locate Metro's cache
        id: metro
        run: echo "dir=$(node -p 'require("node:os").tmpdir()')/metro-cache" >> "$GITHUB_OUTPUT"

      - name: Restore Metro's cache
        id: metro_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.metro.outputs.dir }}
          key: metro-ios-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: metro-ios-

      - name: Run the iOS scenarios
        run: vp run scenarios --target ios

      - name: Save Metro's cache
        if: ${{ !cancelled() && steps.metro_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.metro.outputs.dir }}
          key: metro-ios-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Print the summary
        if: ${{ !cancelled() }}
        run: cat scripts/.e2e/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload traces and captures
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenarios-ios
          path: |
            scripts/.e2e
            !scripts/.e2e/**/*.zip
          include-hidden-files: true
          retention-days: 7
