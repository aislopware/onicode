name: CI

# Pull requests, main and the nightly run.
#
#   lint      rustfmt and clippy, warnings denied
#   core      every non-UI Rust test on Linux (scripts/ci/test-core.sh)
#   ui        onicode-ui and its headless layout tests on Linux
#   ios-core  the mobile core's tests and the generated Swift bindings
#   mac       scripts/ci/mac.sh on a GitLab office Mac (warm, incremental), or on a hosted macOS
#             runner when neither is free or the run has no secrets (fork pull requests)
#   result    "CI result", the one check to require
#
# Pull requests and main use the `ci` nextest profile (slow and soak tests left out); nightly runs
# everything, the release profile and the whole workspace on the office Mac.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * *' # 02:23 ICT

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ${{ github.event_name == 'schedule' && 'default' || 'ci' }}
  ONICODE_STRESS_ROUNDS: ${{ github.event_name == 'schedule' && '100' || '14' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ] && [ "${{ github.event_name }}" != push ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"; echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/|.*\.md$|LICENSE|\.research/)'; then rust=true; else rust=false; fi
          if echo "$files" | grep -qE '^(apps/ios/|crates/(mobile|client|text|markdown)/|Cargo\.lock)'; then ios=true; else ios=false; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"; echo "ios=$ios" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: lint
          save-rust-cache: 'true'
          apt-cache: ui
          apt-packages: &gui-packages >-
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev libx11-xcb-dev
            libfontconfig1-dev libfreetype-dev libasound2-dev libvulkan-dev pkg-config cmake
            libwebkit2gtk-4.1-dev libjson-glib-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  core:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: core
          save-rust-cache: 'true'
      - run: scripts/ci/test-core.sh
      - name: Release profile (nightly)
        if: github.event_name == 'schedule'
        run: scripts/ci/test-core.sh --cargo-profile release

  ui:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: ui
          save-rust-cache: 'true'
          apt-cache: ui
          apt-packages: *gui-packages
      - run: cargo nextest run --config-file scripts/ci/nextest.toml --locked --no-fail-fast -p onicode-ui --lib

  ios-core:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: ios-core
          save-rust-cache: 'true'
      - run: cargo nextest run --config-file scripts/ci/nextest.toml --locked --no-fail-fast -p onicode-text -p onicode-markdown -p onicode-client -p onicode-mobile
      - name: Generated bindings are current
        run: |
          cargo build --locked -p onicode-mobile --lib
          cargo build --locked -p onicode-mobile --bin uniffi-bindgen --features bindgen
          target/debug/uniffi-bindgen generate --library target/debug/libonicode_mobile.so \
            --language swift --out-dir "$RUNNER_TEMP/gen" >/dev/null
          diff -u apps/ios/Onicode/Core/Generated/onicode_core.swift "$RUNNER_TEMP/gen/onicode_core.swift"
          diff -u apps/ios/CoreFFI/onicode_coreFFI.h "$RUNNER_TEMP/gen/onicode_coreFFI.h"
          diff -u apps/ios/CoreFFI/module.modulemap "$RUNNER_TEMP/gen/onicode_coreFFI.modulemap"

  # Office Macs only for trusted code: fork pull requests get no secrets, so they never touch the
  # shared CICache and go straight to the hosted fallback.
  mac:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      fallback: ${{ steps.office.outputs.fallback }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: office
        env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
          SUITE: ${{ github.event_name == 'schedule' && 'nightly' || 'pr' }}
        run: |
          if [ -z "$GITLAB_TRIGGER_TOKEN" ]; then echo "fallback=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e
          python3 scripts/ci/gitlab-bridge.py "${{ github.event.pull_request.head.sha || github.sha }}" "$SUITE"
          code=$?
          if [ $code = 3 ]; then echo "fallback=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code

  mac-hosted:
    needs: mac
    if: needs.mac.outputs.fallback == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ci-macos-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: scripts/ci/mac.sh pr

  result:
    name: CI result
    needs: [changes, lint, core, ui, ios-core, mac, mac-hosted]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c 'import json,sys; [print(k.ljust(11), v["result"]) for k, v in json.load(sys.stdin).items()]'
          test "$FAILED" = false
