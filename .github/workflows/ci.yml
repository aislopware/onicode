name: CI

# Pull requests, main and the nightly run. macOS and iOS are tested thoroughly; Linux gets the cheap gates
# only; nothing else is a target.
#
#   static    every checker that builds nothing (scripts/dev/check.sh static, fmt, deps)
#   lint      clippy for Linux, so cfg(linux) code still compiles, and rustdoc, warnings denied
#   mac       scripts/ci/mac.sh: clippy for macOS, the app, every test, mutants on the diff; nightly gates
#   ios       scripts/ci/ios.sh: swift format, the mobile core, binding drift, the unit tests on iOS 27.2
#   result    "CI result", the GitHub-side check to require
#
# mac and ios run on GitHub's xcode-27 image (macOS 27, Xcode 27.2 with the 27.2 SDKs and simulator).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * *' # 02:23 ICT

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if { [ "$EVENT" != pull_request ] && [ "$EVENT" != push ]; } || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            { echo "rust=true"; echo "ios=true"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/|.*\.md$|LICENSE|\.research/)'; then rust=true; else rust=false; fi
          # iOS builds from its app, the shared crates and the build scripts; the desktop-only crates don't reach it.
          ios=false
          if echo "$files" | grep -E '^(apps/ios/|crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/ios/|scripts/ci/|\.github/)' \
            | grep -qvE '^crates/(ui|engine|harness|preview|preview-label|cli|launch|notify|update|audio|mcp|rpc)/'; then
            ios=true
          fi
          { echo "rust=$rust"; echo "ios=$ios"; } >> "$GITHUB_OUTPUT"

  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tool versions
        run: grep -E '^[A-Z0-9_]+=' scripts/dev/tools.env >> "$GITHUB_ENV"
      # install-action checks each binary against the SHA-256 in its manifest; the action itself is pinned by
      # commit and the tools by version (scripts/dev/tools.env).
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: >-
            typos@${{ env.TYPOS }},taplo@${{ env.TAPLO }},shellcheck@${{ env.SHELLCHECK }},shfmt@${{ env.SHFMT }},
            zizmor@${{ env.ZIZMOR }},cargo-deny@${{ env.CARGO_DENY }},cargo-shear@${{ env.CARGO_SHEAR }}
      - name: ruff, actionlint and swiftlint
        run: scripts/ci/install-static-tools.sh
      - name: Nightly rustfmt
        run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rustfmt
      - name: Checkers
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/dev/check.sh static
      - name: rustfmt
        run: scripts/dev/check.sh fmt
      - name: cargo-deny and cargo-shear
        run: scripts/dev/check.sh deps

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint 1.7.12, the newest, cannot parse the self-repository form `$/` yet.
      - uses: ./.github/actions/linux-ci # zizmor: ignore[self-repository]
        with:
          rust-cache: lint
          save-rust-cache: 'true'
          apt-cache: ui
          apt-packages: >-
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev libx11-xcb-dev
            libfontconfig1-dev libfreetype-dev libasound2-dev libvulkan-dev pkg-config cmake
      - run: cargo lint
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --document-private-items --workspace --features onicode-harness/native-fixture

  mac:
    name: mac
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: xcode-27
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/mac-ci # zizmor: ignore[self-repository]
        with:
          rust-cache: mac
      - name: mac.sh
        env:
          SUITE: ${{ github.event_name == 'schedule' && 'nightly' || 'pr' }}
        run: scripts/ci/mac.sh "$SUITE"

  ios:
    name: ios
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/mac-ci # zizmor: ignore[self-repository]
        with:
          rust-cache: ios
          ios: 'true'
      - name: ios.sh
        env:
          SUITE: ${{ github.event_name == 'schedule' && 'nightly' || 'pr' }}
        run: scripts/ci/ios.sh "$SUITE"

  result:
    name: CI result
    needs: [changes, static, lint, mac, ios]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c 'import json,sys; [print(k.ljust(8), v["result"]) for k, v in json.load(sys.stdin).items()]'
          test "$FAILED" = false
