name: CI

# Pull requests, main and the nightly run. macOS and iOS are tested thoroughly on the office Macs; Linux gets
# the cheap gates only; nothing else is a target.
#
#   static    every checker that builds nothing (scripts/dev/check.sh static, fmt, deps)
#   lint      clippy for Linux, so cfg(linux) code still compiles, and rustdoc, warnings denied
#   mac       scripts/ci/mac.sh on a GitLab office Mac (macOS 27.2 guest, warm, incremental): clippy for macOS,
#             every test, and diff-scoped mutants; nightly adds coverage, Miri, a mutants shard, cargo-hack
#             and the fuzz targets
#   ios       scripts/ci/ios.sh on an office Mac: the mobile core, binding drift, OnicodeTests on a simulator
#   result    "CI result", the one check to require
#
# Hosted macOS runners cannot run onicode (macOS 27.2 and later only). Fork pull requests get no secrets,
# so mac and ios skip with a notice and untrusted code never reaches the shared CICache.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * *' # 02:23 ICT

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if { [ "$EVENT" != pull_request ] && [ "$EVENT" != push ]; } || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"; echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/|.*\.md$|LICENSE|\.research/)'; then rust=true; else rust=false; fi
          # The iOS lane: the app, the crates the mobile core links (every crate but the desktop-only ones),
          # the toolchain and the CI scripts.
          desktop='^crates/(ui|engine|harness|preview|preview-label|cli|launch|notify|update|audio|mcp|rpc)/|^apps/onicode/'
          ios_paths='^(apps/ios/|crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/ios/|scripts/ci/|\.github/)'
          if echo "$files" | grep -vE "$desktop" | grep -qE "$ios_paths"; then ios=true; else ios=false; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"; echo "ios=$ios" >> "$GITHUB_OUTPUT"

  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tool versions
        run: grep -E '^[A-Z0-9_]+=' scripts/dev/tools.env >> "$GITHUB_ENV"
      # install-action checks each binary against the SHA-256 in its manifest; the action itself is pinned by
      # commit and the tools by version (scripts/dev/tools.env).
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: >-
            typos@${{ env.TYPOS }},taplo@${{ env.TAPLO }},shellcheck@${{ env.SHELLCHECK }},shfmt@${{ env.SHFMT }},
            zizmor@${{ env.ZIZMOR }},cargo-deny@${{ env.CARGO_DENY }},cargo-shear@${{ env.CARGO_SHEAR }}
      - name: ruff, actionlint and swiftlint
        run: scripts/ci/install-static-tools.sh
      - name: Nightly rustfmt
        run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rustfmt
      - name: Checkers
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/dev/check.sh static
      - name: rustfmt
        run: scripts/dev/check.sh fmt
      - name: cargo-deny and cargo-shear
        run: scripts/dev/check.sh deps

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint 1.7.12, the newest, cannot parse the self-repository form `$/` yet.
      - uses: ./.github/actions/linux-ci # zizmor: ignore[self-repository]
        with:
          rust-cache: lint
          save-rust-cache: 'true'
          apt-cache: ui
          apt-packages: >-
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev libx11-xcb-dev
            libfontconfig1-dev libfreetype-dev libasound2-dev libvulkan-dev pkg-config cmake
            libwebkit2gtk-4.1-dev libjson-glib-dev
      - run: cargo lint
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --workspace --features onicode-harness/native-fixture

  # The office Macs only take trusted code: fork pull requests get no secrets, so they never touch the shared
  # CICache. Both lanes move their secrets into the office-mac environment.
  mac:
    name: mac
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    environment: office-mac
    timeout-minutes: ${{ github.event_name == 'schedule' && 260 || 90 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SUITE: ${{ github.event_name == 'schedule' && 'nightly' || 'pr' }}
        run: |
          if [ -z "$GITLAB_TRIGGER_TOKEN" ]; then echo "::notice::no office Mac secrets (fork pull request): macOS lane skipped"; exit 0; fi
          python3 scripts/ci/gitlab-bridge.py "$SHA" "$SUITE"

  ios:
    name: ios
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-24.04
    environment: office-mac
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SUITE: ${{ github.event_name == 'schedule' && 'ios-nightly' || 'ios-pr' }}
        run: |
          if [ -z "$GITLAB_TRIGGER_TOKEN" ]; then echo "::notice::no office Mac secrets (fork pull request): iOS lane skipped"; exit 0; fi
          python3 scripts/ci/gitlab-bridge.py "$SHA" "$SUITE"

  result:
    name: CI result
    needs: [changes, static, lint, mac, ios]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c 'import json,sys; [print(k.ljust(8), v["result"]) for k, v in json.load(sys.stdin).items()]'
          test "$FAILED" = false
