name: Toolchain cache

# The only writer of setup-vp's toolchain cache (vp, Node.js, pnpm). Every other
# job restores it with cache-save off, because setup-vp saves in its post step,
# after a job's install and project code could have changed ~/.vite-plus, and
# release.yml's Windows build restores this cache next to release secrets. This
# job checks out only the version files and runs nothing after setup.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/actions/setup-ci-deps/action.yml
      - .github/workflows/toolchain-cache.yml
  # Reads each key twice a week so GitHub's 7-day eviction never reaches one
  # only releases read, such as Windows', and refills one that was evicted.
  schedule:
    - cron: "17 3 * * 1,4"

permissions:
  contents: read

concurrency:
  group: toolchain-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  save:
    name: Save (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /package.json
            /pnpm-workspace.yaml
            /pnpm-lock.yaml
            /.github/actions/setup-ci-deps/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"
          save-toolchain: "true"

      # vp downloads pnpm on first use, and setup-vp saves only a complete
      # installation. Only version files are checked out, so this runs no project code.
      - name: Fetch pnpm
        shell: bash
        run: vp pm cache dir
