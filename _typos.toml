# typos (scripts/dev/check.sh static, the static CI job, pre-commit). A word goes in
# extend-words only when it is a real term of the domain, never to silence a misspelling.
# A test input that is a deliberate fragment or typo is marked on its line with
# `spellchecker:disable-line`.

[default]
extend-ignore-re = [
    # Opt-outs for one line or a block.
    '(?Rm)^.*(#|//|<!--|/\*)\s*spellchecker:disable-line.*$',
    '(?s)(#|//|<!--)\s*spellchecker:off.*?\n\s*(#|//|<!--)\s*spellchecker:on',
    # Commit hashes and hex ids.
    '\b[0-9a-f]{7,64}\b',
    # Plural of an acronym ("PNGs" splits as PN + Gs).
    '\b[A-Z]{2,}s\b',
    # Hyphenated words: mis-keyed, mis-tagged, look-alikes, catch-alls.
    '(?i)\bmis-[a-z]+',
    '(?i)\b(look-alikes|catch-alls)\b',
    # lsof field and flag strings.
    '"-F0pn"|"-nP"',
    # Lint rule codes (ruff's CPY001).
    '\b[A-Z]{1,4}[0-9]{3,4}\b',
    # Secret-shaped test tokens.
    '\bghp_[A-Za-z0-9_]+',
]

[default.extend-words]
# ue(v), the H.26x unsigned exp-Golomb code (onicode_desktop_codec::conformance).
ue = "ue"
# PBR material term (glTF metallicFactor).
metalness = "metalness"
# struct msghdr's msg_controllen.
controllen = "controllen"
# The orb's threshold parameter, kept from the shader it ports.
thr = "thr"
# Claude Code's `[ede_diagnostic]` error breadcrumbs.
ede = "ede"
# LaTeX environment and symbol names zatex parses.
multline = "multline"
oint = "oint"
hom = "hom"
# mach_timebase_info's numer/denom.
numer = "numer"
# Apple's device identifier.
udid = "udid"
# POSIX basic regular expressions.
bre = "bre"
# GLib's G_DEBUG=fatal-criticals.
criticals = "criticals"
# Zed's screen-capture crate.
scap = "scap"
# Names in the vendored file-icon theme (crates/ui/src/file-icons.json): the Stylus extension and the
# theme's own spelling of its serverless icon.
styl = "styl"
severless = "severless"

[files]
extend-exclude = [
    "vendor/",
    # Generated by uniffi-bindgen.
    "apps/ios/Onicode/Core/Generated/",
    "apps/ios/CoreFFI/",
    # Recorded agent streams and transcripts: the bytes a CLI sent, truncated mid-word.
    "*.jsonl",
    "*.ndjson",
    # Translations.
    "README.*.md",
    # Spanish markdown-preview fixtures.
    "scripts/fixtures/markdown-preview/*.mmd",
    "Cargo.lock",
    "package-lock.json",
    "*.svg",
]
